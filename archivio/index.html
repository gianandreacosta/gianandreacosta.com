  <link rel="stylesheet" href="/assets/lab.css">
  <style>
    /* Solo disposizione. Colori, font e superfici: /assets/lab.css */
    body { margin: 0; line-height: 1.5; padding: max(28px, env(safe-area-inset-top)) 16px 40px; }
    main { max-width: 1080px; margin: 0 auto; display: grid; gap: 24px; }
    a { color: inherit; text-decoration: none; }
    .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .lock { width: 11px; height: 11px; opacity: .6; }
    .list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .list a { display: flex; align-items: center; gap: 14px; padding: 18px 20px; transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s; }
    .list a:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--a1) 60%, transparent); }
    .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--a1), var(--a3)); flex: none; }
    .list b { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .list small { font-size: .78rem; color: var(--mut); }
    .list .arr { margin-left: auto; color: var(--mut); }
    @media (prefers-reduced-motion: reduce) { .list a { transition: none; } }
  </style>
</head>
