<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stato backup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una colonna; in alto il semaforo generale, poi backup e dischi come righe di stato */
:root{--bg:#f4f5f3;--panel:#fff;--fg:#1c2320;--muted:#5f6a64;--line:#dde2de;
 --ok:#2f7d4f;--warn:#b0700c;--bad:#b3261e;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#131816;--panel:#1a201d;--fg:#e4eae6;--muted:#97a29c;--line:#2b3430;
 --ok:#5cc28a;--warn:#e2a33c;--bad:#ef6a60;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);
 padding:28px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:1.45rem;font-weight:600}
.sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.big{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.dot{width:18px;height:18px;border-radius:50%;flex:none}
.ok{--c:var(--ok)}.warn{--c:var(--warn)}.bad{--c:var(--bad)}
.dot{background:var(--c)}
.big b{font-size:1.1rem;display:block}
h2{margin:0 0 6px;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
li .dot{width:10px;height:10px}
li span{min-width:0}
.v{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:5px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.foot{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
 <header><h1>Stato backup</h1><p class="sub" id="agg">Carico…</p></header>
 <div class="big" id="gen"><div class="dot"></div><div><b>…</b><span class="sub"></span></div></div>
 <section><h2>Backup</h2><ul id="bk"></ul></section>
 <section><h2>Dischi</h2><ul id="dk"></ul></section>
 <section id="rip" hidden><h2>Ultima prova di ripristino</h2><ul id="rp"></ul></section>
 <p class="foot">Pagina pubblica: solo informazioni generiche. Si aggiorna una volta al giorno. Se il server non manda notizie da più di 30 ore, diventa rossa da sola.</p>
</div>
<script>
const fmt=s=>s?new Date(s).toLocaleString("it-CH",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"mai";
const ore=s=>s?(Date.now()-new Date(s))/36e5:Infinity;
function riga(cls,testo,val,uso){const li=document.createElement("li");li.className=cls;
 li.innerHTML=`<div class="dot"></div><span>${testo}${uso!=null?`<div class="meter"><i style="width:${uso}%"></i></div>`:""}</span><span class="v">${val}</span>`;return li}
fetch("stato.json?t="+Date.now()).then(r=>r.json()).then(d=>{
 const vecchio=ore(d.aggiornato)>30;
 document.getElementById("agg").textContent="Ultimo controllo del server: "+fmt(d.aggiornato);
 const g=document.getElementById("gen");
 let cls="ok",tit="Tutto a posto",det="Tutti i backup sono recenti e i dischi sono sani.";
 if(d.problemi>0){cls="bad";tit=d.problemi===1?"C'è un problema":"Ci sono "+d.problemi+" problemi";det="Dettagli per mail (una sola volta) e qui sotto."}
 if(vecchio){cls="bad";tit="Il server non dà notizie";det="Ultimo segnale "+Math.round(ore(d.aggiornato))+" ore fa: PC spento o controllo fermo."}
 g.className="big "+cls;g.querySelector("b").textContent=tit;g.querySelector(".sub").textContent=det;
 const bk=document.getElementById("bk");
 for(const b of d.backup){const c=b.stato==="ok"?"ok":b.stato==="attesa"?"warn":"bad";bk.appendChild(riga(c,b.nome,"ultimo OK "+fmt(b.ultimo_ok)))}
 const dk=document.getElementById("dk");
 for(const x of d.dischi){const c=x.smart==="guasto"?"bad":(x.libero_gb!=null&&x.libero_gb<100)?"warn":"ok";
  dk.appendChild(riga(c,x.nome+(x.smart==="guasto"?" — SMART: guasto":""),x.uso!=null?`${x.uso}% · ${x.libero_gb} GB liberi`:"non montato",x.uso))}
 if(d.ripristino){document.getElementById("rip").hidden=false;const rp=document.getElementById("rp");
  for(const r of d.ripristino.esito)rp.appendChild(riga(r.diversi?"bad":"ok",r.nome,`${r.provati-r.diversi}/${r.provati} identici`));}
}).catch(()=>{const g=document.getElementById("gen");g.className="big bad";g.querySelector("b").textContent="Stato non disponibile";});
</script>
</body>
</html>
