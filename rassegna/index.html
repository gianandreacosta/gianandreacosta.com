ssOwl (YC S22) sta assumendo un ingegnere AI TypeScript per connettere 300 strumenti SaaS", "fonte": "Hacker News", "link": "https://www.ycombinator.com/companies/accessowl/jobs/hfWAhVp-ai-enabled-senior-software-engineer-typescript-focus"}, {"titolo": "v2026.6.5-alpha.1", "fonte": "OpenClaw Releases", "link": "https://github.com/openclaw/openclaw/releases/tag/v2026.6.5-alpha.1"}, {"titolo": "Crescono gli investimenti nella tecnologia agricola", "fonte": "The Economist Science & Tech", "link": "https://www.economist.com/science-and-technology/2026/06/04/investment-in-agricultural-tech-is-growing"}, {"titolo": "Gwynne Shotwell, numero 2 di Elon Musk presso SpaceX, è la mano ferma dell'azienda", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/04/technology/gwynne-shotwell-spacex.html"}, {"titolo": "Chi è entusiasta dell’I.P.O. di SpaceX? Nerd dello spazio.", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/04/technology/space-nerds-spacex-ipo.html"}, {"titolo": "Cosa fare e cosa non fare quando si acquistano gadget tecnologici usati", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/04/technology/personaltech/used-tech-refurbished.html"}, {"titolo": "Cosa sono le A.I. Gli agenti stanno davvero facendo?", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/04/technology/ai-agents-arena.html"}, {"titolo": "I proprietari di piccole imprese che gestiscono interi eserciti di A.I. Dipendenti", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/04/magazine/ai-agents-openclaw-small-business.html"}, {"titolo": "Questi annunci ChatGPT possono farti amare l'intelligenza artificiale?", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/04/style/chatgpt-advertising-campaign-artificial-intelligence.html"}, {"titolo": "“Gli insegnanti lo odieranno”: come le app dei social media hanno catturato gli adolescenti a scuola", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/04/us/social-media-schools.html"}]}]}, {"date_iso": "2026-06-04", "date_label": "Giovedì 4 giugno 2026", "verifica": {"ver": 56, "tot": 58}, "totale": 805, "n_analizzate": 30, "analisi": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "sommario": "Il Ticino al centro del braccio di ferro con Berna sulla tassa sanitaria italiana, mentre il Mendrisiotto vara una rete contro la violenza domestica. Cronaca nera dalla Svizzera con un femminicidio in Argovia e un incendio a Basilea; il sindaco di Crans-Montana rompe il silenzio sul rogo di Capodanno.", "raccolte": 77, "stories": [{"titolo": "Tassa sulla salute italiana: Ticino e Berna su posizioni diverse", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Tassa-sulla-salute-italiana-Ticino-e-Berna-su-posizioni-diverse--3795504.html", "riassunto": "La perizia commissionata dal Canton Ticino sulla tassa sulla salute italiana apre un confronto con la Confederazione. Berna, interpellata dalla RSI, ribadisce che una tassa a destinazione vincolata sarebbe conforme agli accordi attuali, sulla base di un parere esterno rivelatosi dell'ex professore di San Gallo Robert Waldburger: due professori, due pareri opposti. La Confederazione si dice aperta al dialogo e pronta a chiedere chiarimenti all'Italia. Il presidente della deputazione ticinese Bruno Storni (PS) avverte contro un blocco dei ristorni, giudicato uno strappo dannoso. Il vero braccio di ferro, oggi, è tra governo ticinese e Berna.", "rilevanza": 92, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Mendrisio presenta la sua rete contro la violenza domestica", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Mendrisio-presenta-la-sua-rete-contro-la-violenza-domestica--3795375.html", "riassunto": "Mendrisio, in collaborazione con Stabio e i comuni della regione di polizia II, ha presentato la propria rete di prevenzione della violenza domestica, estendendo al Mendrisiotto un'esperienza partita da Lugano nel 2023 e proseguita a Locarno. La psicologa del Centro competenza violenza della polizia cantonale Marina Lang spiega il parallelismo con la prevenzione sanitaria e lo slogan \"A casa tutto bene?\". L'obiettivo è intervenire sul cosiddetto sottosoglia: quattro casi su cinque non hanno implicazioni penali, ma il disagio c'è. I municipali Caverzasio e Maffi insistono sulla prossimità e sul non criminalizzare le famiglie.", "rilevanza": 84, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Femminicidio nel canton Argovia", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Femminicidio-nel-canton-Argovia--3795998.html", "riassunto": "Una donna di 36 anni è stata uccisa nel pomeriggio di mercoledì nel suo appartamento a Birr, nel canton Argovia. La polizia cantonale ha arrestato il marito 44enne, fortemente sospettato del delitto. L'allarme è giunto poco prima delle 14:00 ed è stato dato da uno dei bambini presenti in casa al momento dei fatti; i minori sono ora affidati alle cure della polizia. Gli agenti, intervenuti in forze, hanno trovato la donna con ferite da taglio, sanguinante e priva di sensi. Un nuovo caso di violenza letale in ambito domestico in Svizzera.", "rilevanza": 80, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crans-Montana: il sindaco rompe il silenzio dopo mesi", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Crans-Montana-il-sindaco-rompe-il-silenzio-dopo-mesi--3795758.html", "riassunto": "Dopo mesi di silenzio sul rogo del bar Constellation della notte di Capodanno, il sindaco di Crans-Montana Nicolas Féraud (PLR) ha accettato un'intervista con l'emittente vallesana Canal 9, la prima dopo quella del 27 gennaio. Féraud annuncia per il 16 giugno un'assemblea a Chermignon-d'en-Bas per fare il punto con trasparenza, ipotesi a porte chiuse che dice però di voler evitare. Pur fra numerose richieste di dimissioni, in particolare dai media italiani, ribadisce di non avere intenzione di lasciare. Un caso che resta sotto i riflettori della Svizzera romanda e italiana.", "rilevanza": 76, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Edificio in fiamme a Basilea", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Edificio-in-fiamme-a-Basilea--3796049.html", "riassunto": "Un grave incendio è divampato nella serata di mercoledì in un edificio del quartiere Dreispitz di Basilea, con un intervento in forze di pompieri e polizia. La Münchensteinerstrasse è stata chiusa al traffico, come indicato dalla polizia cantonale. Secondo le immagini riferite dal portale del Blick, dalle finestre uscivano fiamme alte diversi metri e un denso fumo ha avvolto l'area. Non è chiaro se nello stabile si trovassero persone. La polizia ha annunciato ulteriori informazioni in un secondo momento. Il bilancio resta da definire.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Economia svizzera: cresce con il freno a mano tirato", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/economia/Economia-svizzera-cresce-con-il-freno-a-mano-tirato--3794450.html", "riassunto": "Due rapporti, di Economiesuisse e dell'OCSE, fotografano un'economia svizzera che cresce sotto il proprio potenziale a causa delle incertezze geopolitiche. Economiesuisse prevede un PIL all'1,0% nel 2026 (pronostico confermato) e all'1,2% nel 2027, con inflazione allo 0,8% quest'anno e all'1,0% nei dodici mesi successivi. I conflitti in Ucraina e Medio Oriente, le quotazioni elevate del petrolio e i maggiori costi di trasporto spingono i prezzi. Per la federazione delle imprese un'impennata dell'inflazione come dopo l'invasione russa non è però attesa. L'OCSE rinvia una crescita concreta al 2027.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Bevande energetiche in vendita con troppa caffeina", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/dialogo/Bevande-energetiche-in-vendita-con-troppa-caffeina--3794230.html", "riassunto": "Un'inchiesta di Impact Investigativ (SRF) accende i riflettori sugli energy drink venduti con quantità eccessive di caffeina. Il racconto parte da Nicolas, 29enne che consuma circa tre lattine al giorno e si definisce dipendente, arrivato in un periodo a sei litri quotidiani. Le bevande, ricche di caffeina, zucchero e taurina, sono promosse soprattutto verso i giovani: secondo la Confederazione un giovane svizzero su cinque tra i 14 e i 17 anni ne consuma almeno uno a settimana. Tra i possibili effetti collaterali tachicardia, disturbi del sonno e nervosismo.", "rilevanza": 56, "rsi": true, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "cronaca_svizzera", "emoji": "🇨🇭", "nome": "Cronaca Svizzera", "sommario": "Dominano i temi economici svizzeri legati agli Stati Uniti: nuovi dazi USA al 12,5% sulla Svizzera e crollo della fiducia delle PMI. Forte presenza ticinese con la 'tassa sulla salute' sui frontalieri e gli sviluppi del caso Crans-Montana, oltre a un femminicidio in Argovia.", "raccolte": 116, "stories": [{"titolo": "Nuovi dazi USA fino al 12,5% per 60 Paesi, Svizzera inclusa", "fonte": "Ticinonews Svizzera / RSI Svizzera", "link": "https://www.ticinonews.ch/economia/proposti-nuovi-dazi-usa-fino-al-125-per-60-paesi-svizzera-compresa-434914", "riassunto": "Il rappresentante USA per il commercio Jamieson Greer ha proposto nuovi dazi dal 10% al 12,5% su 60 Paesi, accusati di non aver contrastato il lavoro forzato. Alla Svizzera spetterebbe l'aliquota massima del 12,5%, accanto a Cina, Vietnam, Taiwan e Regno Unito. La mossa rilancia la politica tariffaria dopo le battute d'arresto legali dell'amministrazione Trump e passerà da una consultazione pubblica. Il presidente della Confederazione Guy Parmelin ha respinto l'accusa a margine di una conferenza OCSE a Parigi, dopo un breve colloquio con lo stesso Greer. La SECO contesta la fondatezza delle contestazioni americane.", "rilevanza": 92, "rsi": false, "aff": true, "verok": 1, "vertot": 2}, {"titolo": "Uccide la compagna a Birr (AG), arrestato il presunto autore", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/svizzera/uccide-la-compagna-in-un-complesso-residenziale-arrestato-il-presunto-autore-429609", "riassunto": "Una donna è stata uccisa a Birr, nel Canton Argovia, in un caso riconducibile alla violenza domestica. Secondo l'Aargauer Zeitung, il presunto responsabile, identificato nel compagno della vittima, è stato arrestato poco dopo i fatti. La polizia cantonale argoviese è intervenuta con un importante dispositivo in una zona residenziale, transennando l'area per i rilievi della scientifica. Sono in corso accertamenti per chiarire l'esatta dinamica dell'aggressione, avvenuta all'interno del complesso abitativo.", "rilevanza": 84, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "'Tassa sulla salute' italiana: Quadri incalza il Consiglio federale", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/tassa-sulla-salute-quadri-incalza-il-consiglio-federale-dopo-la-perizia-hinny-429612", "riassunto": "Il consigliere nazionale leghista Lorenzo Quadri porta a Berna la perizia commissionata dal Cantone Ticino sulla 'tassa sulla salute' italiana. Il professor Pascal Hinny, ordinario di diritto tributario a Friburgo, giudica il nuovo prelievo italiano sui vecchi frontalieri incompatibile con l'Accordo fiscale tra Svizzera e Italia. Quadri sottolinea che ciò contraddice la risposta del Consiglio federale del 20 maggio. Pur ritenendo la tassa positiva come funzione anti-dumping per il mercato del lavoro ticinese, chiede che Berna ne faccia valere l'incompatibilità per ridurre i ristorni fiscali versati oltre confine, trattenendo così più gettito.", "rilevanza": 80, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Embolo bloccato per il viaggio negli USA: il caso ESTA", "fonte": "RSI Svizzera", "link": "https://www.rsi.ch/info/svizzera/Embolo-il-viaggio-negato-negli-USA-dove-ESTA-%C3%A8-il-problema--3795138.html", "riassunto": "L'attaccante della Nazionale svizzera Breel Embolo non ha potuto imbarcarsi martedì con i compagni per gli Stati Uniti a causa di un problema con l'autorizzazione elettronica ESTA. Secondo l'Associazione svizzera di calcio, poco prima della partenza le autorità statunitensi hanno comunicato l'intenzione di riesaminare l'ESTA, fino ad allora valida. Si specula su un possibile legame con la condanna per minaccia passata in giudicato ad aprile, relativa a un'aggressione verbale del 2018 quando il 29enne giocava nel Basilea. L'ESTA consente l'ingresso senza visto fino a 90 giorni nell'ambito del Visa Waiver Program.", "rilevanza": 76, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crolla la fiducia delle PMI svizzere ai minimi storici", "fonte": "Ticinonews Svizzera", "link": "https://www.ticinonews.ch/svizzera/crolla-la-fiducia-delle-piccole-e-medie-imprese-svizzere-434916", "riassunto": "La fiducia delle piccole e medie imprese svizzere è scesa ai minimi da diversi anni: il barometro PMI NZZ è calato a -7,3 punti, il livello più basso dall'avvio delle indagini nel 2021. A pesare sono la situazione geopolitica, i dazi americani e la burocrazia. L'analisi della scuola universitaria Kalaidos, su 495 dirigenti, segnala criticità su scambi esteri, valuta, catene di approvvigionamento e oneri normativi. L'unico segnale positivo riguarda l'integrazione delle nuove tecnologie. Il 55% delle aziende si dice resiliente, una su dieci poco o per niente. L'indice esce in vista dello Swiss Economic Forum a Interlaken.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Incendio di Crans-Montana: interrogato un ex municipale di Chermignon", "fonte": "RSI Svizzera", "link": "https://www.rsi.ch/info/svizzera/Incendio-a-Crans-Montana-interrogato-un-ex-municipale--3794856.html", "riassunto": "L'ex consigliere comunale Jérémie Rey ha accettato di rispondere agli inquirenti nell'inchiesta sull'incendio del bar 'Le Constellation' di Crans-Montana, a differenza di altri imputati che si sono avvalsi del silenzio. Rey, a capo del dicastero delle costruzioni dell'ex Comune di Chermignon dal 2013 al 2016, è al centro dell'audizione perché nel 2015 il Comune non richiese una domanda di costruzione né controlli approfonditi per gli importanti lavori di ristrutturazione del bar. Venerdì saranno interrogati anche i coniugi Moretti, che gestivano il locale.", "rilevanza": 68, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crans-Montana, il sindaco Féraud rompe il silenzio dopo 126 giorni", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/crans-montana-il-sindaco-torna-a-parlare-dopo-126-giorni-andare-via-sarebbe-una-diserzione-429632", "riassunto": "Il sindaco di Crans-Montana Nicolas Féraud (PLR) ha parlato a Canal 9 per la prima volta dopo 126 giorni di silenzio sulla tragedia di Capodanno. Ha difeso l'operato del Municipio e respinto le richieste di dimissioni, definendo un eventuale abbandono 'una diserzione'. Ha annunciato un'assemblea pubblica il 16 giugno a Chermignon-d'en-Bas per fare il punto con trasparenza, dicendosi contrario allo svolgimento a porte chiuse pur lasciando decidere la democrazia. Ha ribadito le scuse alle persone offese durante la conferenza stampa del 6 gennaio.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "cultura", "emoji": "🎭", "nome": "Cultura", "sommario": "Dominano gli appuntamenti musicali svizzeri: il Montreux Jazz Festival celebra i 60 anni omaggiando Miles Davis, mentre il ticinese Fabio Lafranchi riceve un premio internazionale. Spazio anche al lutto per il soulman Peabo Bryson (incrociato da due fonti) e a curiosità scientifiche da Ötzi ai polpi di Friborgo.", "raccolte": 38, "stories": [{"titolo": "Il Montreux Jazz Festival omaggia Miles Davis", "fonte": "CdT Società", "link": "https://www.cdt.ch/societa/il-montreux-jazz-festival-omaggia-miles-davis-429563", "riassunto": "Il Montreux Jazz Festival ha presentato il programma gratuito della 60esima edizione, in scena dal 3 al 18 luglio con oltre 700 fra concerti e attività su dodici palchi. La seconda settimana sarà dedicata al centenario della nascita di Miles Davis (1926-1991), con la proiezione di quattro suoi concerti a Montreux e la presentazione di dischi storici come «Kind of Blue». L'ultimo weekend celebrerà invece David Bowie e i suoi legami con il jazz. Un appuntamento di rilievo internazionale e di forte impatto per la Svizzera romanda.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Muore Peabo Bryson, voce R&B celebre per i duetti nei film Disney", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/musica/1930125/bryson-disney-anni-peabo-film-due-re-duetti", "riassunto": "È morto a 75 anni, pochi giorni dopo un ictus, il cantante R&B statunitense Peabo Bryson, vincitore di due Grammy. La sua voce è legata soprattutto ai duetti delle colonne sonore Disney: «Beauty and the Beast» con Céline Dion e «A Whole New World» da «Aladdin» con Regina Belle, brano con cui scalzò Whitney Houston dalla vetta delle classifiche USA. Nato in South Carolina, aveva costruito dagli anni Settanta una lunga carriera nell'R&B romantico americano. La notizia è confermata da più testate.", "rilevanza": 74, "rsi": false, "aff": true, "verok": 1, "vertot": 2}, {"titolo": "Bluebird Award a Fabio Lafranchi", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/culture/1930210/blues-bluebird-award-lafranchi-fabio-blue", "riassunto": "Riconoscimento internazionale per il ticinese Fabio Lafranchi, cofondatore e direttore artistico del Vallemaggia Magic Blues, premiato con il Bluebird Award lo scorso fine settimana a Weinheim, in Germania. Il premio, attribuito dalla Beyond Blue Connection, ha celebrato nel tempo nomi come B.B. King ed Eddie Palmieri nella sezione artisti e importanti promotori culturali nella categoria Blue People. La motivazione elogia il contributo di Lafranchi nel rendere il festival vallemaggese un evento culturale di rilevanza internazionale.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Oh specchio, specchio delle mie brame...", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/scienze/1930115/specchio-polpi-grado-riflesse-immagini", "riassunto": "Uno studio dell'Università di Friborgo, condotto con il Dartmouth College e pubblicato su «Current Biology», dimostra che i polpi sanno usare consapevolmente le immagini riflesse da uno specchio per individuare cibo fuori dal loro campo visivo. È la prima volta che tale capacità viene provata in un invertebrato, finora osservata solo in vertebrati come scimmie, elefanti o uccelli. Nel 73% dei tentativi gli animali hanno scelto il percorso corretto, una percentuale che esclude statisticamente il caso. Una ricerca svizzera di valore scientifico.", "rilevanza": 66, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Ötzi, svelato il microbioma di 5.000 anni fa", "fonte": "Ticinonews Magazine", "link": "https://www.ticinonews.ch/magazine/otzi-svelato-il-microbioma-di-5000-anni-fa-434933", "riassunto": "Uno studio dell'Istituto per lo studio delle mummie di Eurac Research di Bolzano, pubblicato su «Microbiome», ha analizzato l'ecosistema di microrganismi della mummia del Similaun, distinguendo la flora intestinale originaria dell'Iceman dai microrganismi giunti dopo la morte. La scoperta più sorprendente riguarda lieviti specializzati simili a ceppi antartici, capaci di sopravvivere a temperature estreme e ancora vitali a -6°C nel Museo dell'Alto Adige. I risultati aprono prospettive per processi industriali a basse temperature.", "rilevanza": 58, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "geopolitica", "emoji": "🌍", "nome": "Geopolitica & Esteri", "sommario": "Dominano la diplomazia Trump-Iran (presunto stop al nucleare, possibile vertice con Khamenei) e l'avanzata israeliana nel sud del Libano, con tensioni anche tra Israele e il governo italiano. Sul fronte svizzero, novità doganali per i turisti dello shopping verso la Germania.", "raccolte": 484, "stories": [{"titolo": "Trump: l'Iran ha accettato di rinunciare alle armi nucleari", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/03/trump-liran-ha-accettato-di-rinunciare-alle-armi-nucleari_ac19fedf-dc00-4f54-a8a4-d4d0bcb00f21.html", "riassunto": "Donald Trump afferma che l'Iran avrebbe accettato di rinunciare alle armi nucleari, in un'intervista podcast con Miranda Devine del Washington Post. È una dichiarazione di forte peso geopolitico, ma resta unilaterale e non confermata da Teheran: va trattata con cautela in attesa di riscontri ufficiali. Il tema si lega ai negoziati in corso e alla possibilità, evocata dallo stesso Trump, di un futuro incontro con la guida suprema iraniana.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Trump: vogliamo separare la questione Libano dai negoziati con l'Iran", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/03/trump-vogliamo-separare-la-questione-libano-dai-negoziati-con-liran_c10349cd-0307-4c30-b7a4-f824320c9a18.html", "riassunto": "Trump vuole tenere distinti il dossier libanese e i negoziati con l'Iran, definendoli situazioni di natura diversa. Rivela contatti diretti con Hezbollah — a suo dire i primi in assoluto — e annuncia una tregua di fatto: il movimento sciita avrebbe acconsentito a non sparare, così come Israele. Una svolta potenzialmente rilevante per la de-escalation nel sud del Libano, da verificare sul terreno.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "L'invasione israeliana alimenta le divisioni tra i libanesi", "fonte": "Internazionale", "link": "https://www.internazionale.it/video/2026/06/04/israele-libano-divisioni", "riassunto": "L'esercito israeliano continua a occupare una fascia di territorio nel sud del Libano, dichiarando di voler sconfiggere Hezbollah, alleata di Teheran. Il documentario del Guardian con Matthew Cassel mostra come il conflitto stia accentuando le fratture tra le comunità libanesi: il disarmo di Hezbollah è condiviso da molti, ma i suoi sostenitori parlano di \"resistenza\" come unica difesa. In gioco la fragile convivenza costruita dopo la guerra civile (1975-1990).", "rilevanza": 65, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "economia", "emoji": "💰", "nome": "Economia & Finanza", "sommario": "Dominano i nuovi dazi USA del 12,5% minacciati alla Svizzera (e ad altre 60 economie) col pretesto del lavoro forzato, con la replica netta di SECO e Parmelin. In secondo piano l'acquisizione di Yfood da parte di Nestlé, le scelte formative dei giovani e il dibattito sulle quote rosa.", "raccolte": 43, "stories": [{"titolo": "Nuovi dazi? Gli USA accusano, la SECO respinge tutto", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930141/lavoro-svizzera-seco-dazi-stati-trump", "riassunto": "Washington minaccia dazi aggiuntivi del 12,5% a circa 60 economie, Svizzera inclusa, giustificandoli con la lotta al lavoro forzato e una legge commerciale del 1974. La SECO respinge le accuse: la direttrice Helene Budliger Artieda ha spiegato alla SRF che il lavoro forzato è già vietato dalla costituzione e dal diritto civile e penale, e che la Svizzera è stata pioniera nell'inserire il divieto negli appalti pubblici. La Segreteria nega distorsioni della concorrenza a danno delle imprese USA. È la storia economica più rilevante per impatto diretto sulla Confederazione e con citazione esplicita della SRF.", "rilevanza": 95, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Trump minaccia nuovamente la Svizzera", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930056/lavoro-svizzera-dazi-seco-trump-merci-minaccia", "riassunto": "L'Ufficio del Rappresentante per il Commercio USA ha annunciato martedì sera la minaccia di nuovi dazi contro 60 Paesi, tra cui UE, Gran Bretagna e Svizzera, accusati di non contrastare l'import di merci legate a presunto lavoro forzato. Le tariffe aggiuntive sarebbero comprese tra il 10 e il 12,5%. Il rappresentante Jamieson Greer parla di «concorrenza sleale» a danno dei lavoratori statunitensi. La decisione si fonda su un'indagine avviata il 12 marzo, con audizioni aperte fino a inizio luglio. Notizia breaking ad alto impatto commerciale.", "rilevanza": 90, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Svizzera sotto tiro USA, Parmelin: «Lavoriamo per trovare soluzioni»", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930137/lavoro-accuse-respinge-berna-dfe", "riassunto": "Il presidente e ministro dell'economia Guy Parmelin ha ribadito la posizione elvetica a Parigi, a margine della conferenza ministeriale dell'OCSE, in un incontro col rappresentante USA Jamieson Greer. Su X ha scritto che «entrambe le parti continuano a lavorare per trovare soluzioni». Il Dipartimento federale dell'economia respinge «veementemente» le accuse, rivendicando un approccio globale fatto di regolamentazione statale, valutazioni di rischio del settore privato e cooperazione internazionale. È il tassello diplomatico del dossier dazi.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Nestlé rileva la totalità di Yfood, leader nei pasti pronti da bere", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930105/yfood-nestle-pasti-leader-vendita", "riassunto": "Nestlé ha annunciato l'acquisizione totale della tedesca Yfood, leader europeo nei pasti pronti da bere, rilevando il 51% ancora in mano ai fondatori dopo essere entrata nel 2023 con il 49%. Il prezzo non è stato reso noto. Yfood, fondata nel 2017 a Monaco, mantiene autonomia operativa, sede in Germania e circa 150 dipendenti, con un fatturato 2025 di circa 150 milioni di euro (137 milioni di franchi) in crescita a doppia cifra. L'operazione rafforza il segmento nutrizione del gruppo guidato dal nuovo CEO Philipp Navratil.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "La maggior parte dei giovani ha già un contratto di apprendistato", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930128/scuola-giovani-apprendistato-svizzera-obbligo", "riassunto": "Secondo un'inchiesta di Keystone-ATS presso gli uffici competenti, la maggior parte dei giovani ha già scelto un posto di apprendistato per dopo la fine della scuola dell'obbligo, ma cresce il passaggio verso licei e scuole specializzate. Sul portale Yousty risultano 18'000 posti di tirocinio e quasi 15'000 nel registro Lena. Nel 2025 circa metà dei giovani ha iniziato una formazione professionale di base, mentre il 34% è entrato in liceo o scuola specializzata, quota in lieve crescita. Tema di mercato del lavoro rilevante per la Svizzera.", "rilevanza": 60, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "ai_openclaw", "emoji": "🤖", "nome": "AI & Tech", "sommario": "Settimana densa sul fronte AI europea: Anthropic apre a Milano e supera OpenAI per valutazione, mentre l'UE delinea un piano di sovranità tecnologica. Sul versante sicurezza, una falla nell'assistente AI di Meta esponeva i profili Instagram. Lutto nel giornalismo digitale italiano per la morte di Carola Frediani.", "raccolte": 47, "stories": [{"titolo": "L'Unione Europea delinea un piano per ridurre la dipendenza dalla tecnologia americana", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/03/technology/european-union-tech-sovereignty.html", "riassunto": "L'UE a 27 avrebbe presentato un piano per espandere data center, semiconduttori e capacità di cloud computing europei, nell'ottica di ridurre la dipendenza dalla tecnologia statunitense. Il tema della sovranità digitale è di diretto interesse per la Svizzera, integrata nei mercati e nelle infrastrutture europee. ATTENZIONE: il corpo dell'articolo non è disponibile, quindi i dettagli su strumenti, cifre e tempistiche restano da verificare alla fonte.", "rilevanza": 72, "rsi": false, "aff": false, "verok": 0, "vertot": 0}, {"titolo": "Anthropic è davvero più \"buona\" delle altre aziende di AI?", "fonte": "Il Post Tecnologia", "link": "https://www.ilpost.it/2026/06/03/anthropic-buona/", "riassunto": "Anthropic, fondata nel 2021 da ex ricercatori di OpenAI critici verso Sam Altman, coltiva da tempo l'immagine di azienda AI prudente; il pezzo di Pietro Minto mostra però che la realtà è più sfumata. Nell'ultimo anno la società è cresciuta fino a una valutazione di 965 miliardi di dollari, superando OpenAI. La scorsa settimana ha annunciato l'apertura della sesta sede europea, a Milano, e ricevuto nuovi investimenti per 65 miliardi. Il cofondatore Chris Olah era l'unico rappresentante del settore alla presentazione dell'enciclica di papa Leone XIV sull'AI. Rilievo per il lettore ticinese per la prossimità della nuova sede milanese.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Per hackerare i profili Instagram bastava chiedere all'assistente AI di Meta", "fonte": "Il Post Tecnologia", "link": "https://www.ilpost.it/2026/06/03/sicurezza-informatica-assistente-ai-meta-chatbot/", "riassunto": "Una falla nel chatbot di assistenza tecnica di Meta permetteva di prendere il controllo di profili Instagram e Facebook altrui. Bastava mascherare la posizione con una VPN impostandola su quella del titolare e, se richiesta, fornire una foto del profilo bersaglio modificata con l'AI per ingannare la verifica d'identità. A quel punto si poteva associare una nuova email all'account e farsi inviare un codice per cambiare la password. Tra i casi notevoli del weekend, un profilo Instagram legato a Barack Obama. Meta ha dichiarato di aver risolto il problema.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}], "collezione": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "conteggio": 77, "items": [{"titolo": "Dazi UE sull’acciaio la Svizzera difende il libero scambio", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/economia/Dazi-UE-sull%E2%80%99acciaio-la-Svizzera-difende-il-libero-scambio--3796007.html"}, {"titolo": "Economia svizzera cresce con il freno a mano tirato", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/economia/Economia-svizzera-cresce-con-il-freno-a-mano-tirato--3794450.html"}, {"titolo": "L’UE lancia il piano per la sovranità tecnologica", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/scienza-e-tecnologia/L%E2%80%99UE-lancia-il-piano-per-la-sovranit%C3%A0-tecnologica--3795402.html"}, {"titolo": "Crans Montana il sindaco rompe il silenzio dopo mesi", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Crans-Montana-il-sindaco-rompe-il-silenzio-dopo-mesi--3795758.html"}, {"titolo": "Bevande energetiche in vendita con troppa caffeina", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/dialogo/Bevande-energetiche-in-vendita-con-troppa-caffeina--3794230.html"}, {"titolo": "Femminicidio nel canton Argovia", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Femminicidio-nel-canton-Argovia--3795998.html"}, {"titolo": "Iran la Camera dei rappresentanti USA chiede lo stop alla guerra", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/mondo/Iran-la-Camera-dei-rappresentanti-USA-chiede-lo-stop-alla-guerra--3796064.html"}, {"titolo": "Edificio in fiamme a Basilea", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Edificio-in-fiamme-a-Basilea--3796049.html"}, {"titolo": "Tassa sulla salute italiana Ticino e Berna su posizioni diverse", "fonte": "RSI Ticino", "link": "https : [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "sommario": "Settimana dominata dal nodo dell'attuazione delle iniziative ticinesi sulle casse malati, mentre la cronaca registra un'emergenza su un bus nel Bellinzonese e tre arresti per furti a Chiasso. Sul piano federale spiccano la perquisizione a Gunvor per sospetta corruzione e gli aggiornamenti su dogana e ricerca.", "raccolte": 52, "stories": [{"titolo": "Iniziative casse malati, perizie e costi dividono i partiti", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Iniziative-casse-malati-perizie-e-costi-dividono-i-partiti--3793118.html", "riassunto": "La Commissione della Gestione del Gran Consiglio ticinese ha ricevuto due documenti chiave in vista della seduta di lunedì sull'attuazione delle due iniziative sulle casse malati (Lega e Sinistra). Una perizia del Centro per la Democrazia di Aarau (ZDA) affidata a un costituzionalista smentisce il Governo, concludendo che non si può vincolare l'entrata in vigore delle iniziative — approvate dal popolo lo scorso settembre — al loro finanziamento. Sull'iniziativa della Sinistra (tetto premi al 10% del reddito), i calcoli del Consiglio di Stato mostrano un costo di 300 milioni col premio medio di riferimento o 130 milioni con quello effettivo. Nodo politico di forte impatto cantonale.", "rilevanza": 88, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Bellinzonese, gas urticante sul bus: 3 persone all'ospedale", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Bellinzonese-gas-urticante-sul-bus-3-persone-all%E2%80%99ospedale--3792842.html", "riassunto": "Martedì pomeriggio, attorno alle 13:45, una sostanza urticante si è diffusa nell'abitacolo di un bus di linea a Galbisio, sulla tratta tra Castione e Monte Carasso, costringendo all'evacuazione del mezzo che trasportava una decina di persone. All'origine una bomboletta di gas urticante presente a bordo; alcuni passeggeri hanno accusato sintomi respiratori. Tre persone — due bambini e un adulto — sono state portate in ospedale per controlli, mentre una decina di passeggeri è stata visitata sul posto. La polizia ha chiuso temporaneamente la strada; le cause della fuoriuscita restano ignote.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Furti con scasso, tre arresti a Chiasso", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Furti-con-scasso-tre-arresti-a-Chiasso--3792911.html", "riassunto": "A Chiasso i collaboratori dell'Ufficio federale della dogana e della sicurezza dei confini hanno fermato due cittadini cileni di 26 e 21 anni residenti in Cile e un cubano 26enne residente in Italia, sospettati di una serie di furti con scasso in abitazioni nelle ultime settimane, secondo un comunicato congiunto di polizia cantonale e ministero pubblico. Nella loro auto con targhe italiane sono stati trovati attrezzi per lo scasso e refurtiva, parte della quale è stata recuperata. L'arresto è già stato confermato dal giudice dei provvedimenti coercitivi; i tre rispondono di furto con scasso, danneggiamento e violazione di domicilio.", "rilevanza": 80, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Sospetta corruzione, perquisita la sede di Gunvor a Ginevra", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Sospetta-corruzione-perquisita-la-sede-di-Gunvor-a-Ginevra--3792401.html", "riassunto": "La sede ginevrina del gigante delle materie prime Gunvor è stata perquisita dalla fedpol in maggio su mandato del Ministero pubblico della Confederazione (MPC), nell'ambito di un procedimento penale contro ignoti per sospetta corruzione di pubblici ufficiali stranieri. L'informazione, rivelata dall'ONG Public Eye e confermata a Keystone-ATS dal portavoce dell'MPC, riguarda un contratto petrolifero stipulato in Gabon nel 2024 in condizioni poco trasparenti e un presunto sistema di pagamenti paralleli a intermediari in Africa. Gunvor afferma di non essere direttamente coinvolta. La società è già stata condannata in Svizzera per corruzione nel 2019 (Congo e Costa d'Avorio) e nel 2024 (Ecuador).", "rilevanza": 68, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "QuickZoll tiene conto di entrambe le aliquote IVA", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/QuickZoll-tiene-conto-di-entrambe-le-aliquote-IVA--3792971.html", "riassunto": "L'Ufficio federale della dogana e della sicurezza dei confini ha aggiornato l'app QuickZoll, utile a chi entra in Svizzera con merci oltre i limiti di franchigia. La nuova versione consente di indicare separatamente il valore delle merci per le due aliquote IVA in vigore — quella normale dell'8,1% e quella ridotta del 2,6% — calcolando in automatico l'imposta dovuta e garantendo gli stessi vantaggi di una dichiarazione doganale formale. Lanciata nel 2018, l'app è passata da 13'000 dichiarazioni nel primo anno alle 192'000 del 2025, per 13 milioni di franchi di entrate. Tema rilevante per i frontalieri ticinesi.", "rilevanza": 60, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "cronaca_svizzera", "emoji": "🇨🇭", "nome": "Cronaca Svizzera", "sommario": "Settimana dominata dai temi migratori e identitari: la revoca della cittadinanza all'aggressore di Winterthur e il sondaggio sulla crescita demografica a ridosso del voto sull'iniziativa UDC. In evidenza anche il sostegno svizzero alla ricostruzione dell'Ucraina, casi di consumo e frodi (brushing Amazon, lingotti d'oro falsi) e lo strascico finanziario dei Giochi di Milano-Cortina nei Grigioni.", "raccolte": 36, "stories": [{"titolo": "La revoca della cittadinanza all'aggressore di Winterthur è una «decisione affrettata»", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/la-revoca-della-cittadinanza-allaggressore-di-winterthur-e-una-decisione-affrettata-429189", "riassunto": "Il dibattito sulla revoca della cittadinanza allo svizzero-turco autore dell'aggressione a coltellate di Winterthur (ZH) si fa acceso. La Segreteria di Stato della migrazione precisa che il provvedimento richiede una sentenza definitiva per reati gravissimi (terrorismo, crimini contro l'umanità, criminalità organizzata) e che negli ultimi anni dieci procedure simili hanno portato a sette revoche. Il giurista Alberto Achermann (Università di Berna) giudica «affrettata» la richiesta avanzata dal direttore della sicurezza zurighese Mario Fehr, perché non è ancora accertata la responsabilità penale dell'autore, che dovrebbe poi essere espulso in Turchia.", "rilevanza": 90, "rsi": true, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Due svizzeri su tre favorevoli alle misure per frenare la popolazione", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/due-svizzeri-su-tre-favorevoli-alle-misure-per-frenare-la-popolazione-429479", "riassunto": "A meno di due settimane dal voto sull'iniziativa dell'UDC, un sondaggio Demoscope per Infosperber (1.110 aventi diritto, 21-31 maggio 2026) mostra una popolazione preoccupata dalla prospettiva dei 10 milioni di abitanti. Il 51% considera problematica una Svizzera oltre quella soglia e solo il 39% la immagine fattibile tra trent'anni. Il 62% sarebbe favorevole a misure per frenare la crescita demografica anche mantenendo la libera circolazione. Il sostegno è più forte nella Svizzera tedesca (66%) che in Romandia (51%), con uomini più favorevoli delle donne.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "«La ricostruzione dell'Ucraina deve coinvolgere maggiormente il settore privato svizzero»", "fonte": "Ticinonews Svizzera", "link": "https://www.ticinonews.ch/svizzera/la-ricostruzione-dellucraina-deve-coinvolgere-maggiormente-il-settore-privato-svizzero-434819", "riassunto": "Il Consiglio nazionale ha approvato con 148 voti a 9 e 38 astensioni un accordo con Kiev che apre la ricostruzione dell'Ucraina alle imprese svizzere, soprattutto in ambito energetico e infrastrutturale. Gli aiuti sono a fondo perso: Kiev definirà un elenco di beni e servizi che la Svizzera acquisterà da aziende elvetiche escludendo i fornitori stranieri. Per il programma 2025-2028 sono previsti 1,5 miliardi di franchi, mentre tra il 2025 e il 2036 lo stanziamento complessivo salirà a cinque miliardi. La Camera ha inoltre approvato all'unanimità l'aggiornamento dell'accordo di libero scambio AELS-Ucraina.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Riceve pacchi Amazon ogni giorno senza aver ordinato nulla: il mistero del «brushing»", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/svizzera/riceve-pacchi-amazon-ogni-giorno-senza-aver-ordinato-nulla-il-mistero-del-brushing-427858", "riassunto": "Una famiglia di Bienne ha ricevuto per settimane pacchi Amazon mai ordinati, dagli oggetti più disparati: penne a sfera, copriscarpe per sale operatorie, libri da colorare. Al centro un diciassettenne che due anni fa aveva aperto un account senza acquisti, poi bloccato per «attività sospette». Nonostante i ripetuti contatti con il servizio clienti, le consegne sono continuate. Amazon, senza commentare il caso, indica come possibile spiegazione il «brushing», pratica fraudolenta per pubblicare false recensioni inviando prodotti economici a indirizzi ottenuti illegalmente. Il caso è emerso grazie a RTS e alla trasmissione SRF «Espresso».", "rilevanza": 68, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Lanciata l'iniziativa per una maggiore sicurezza digitale", "fonte": "RSI Svizzera", "link": "https://www.rsi.ch/info/svizzera/Lanciata-l%E2%80%99iniziativa-per-una-maggiore-sicurezza-digitale--3791825.html", "riassunto": "L'associazione Swiss Digital Pact ha lanciato l'iniziativa popolare «Per la sicurezza digitale della Svizzera», che chiede alla Confederazione di garantire resilienza e sovranità digitale a livello costituzionale. Il comitato vuole disposizioni di sicurezza vincolanti per tutti gli attori del settore, pubblici e privati, oltre alla protezione dei dati personali e alla promozione delle competenze digitali. Il presidente Gérald Vernez chiede che la sicurezza digitale sia riconosciuta come «missione centrale dello Stato». L'associazione si dichiara indipendente da qualsiasi partito.", "rilevanza": 60, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Traffico olimpico nei Grigioni, finora ancora nessuna risposta da parte italiana", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/traffico-olimpico-nei-grigioni-finora-ancora-nessuna-risposta-da-parte-italiana-429458", "riassunto": "La gestione della viabilità durante i Giochi olimpici di Milano-Cortina dello scorso febbraio è costata 3,5 milioni di franchi al Canton Grigioni, che intende farsi carico solo di circa 0,9 milioni e ha fatturato i restanti 2,6 milioni all'Italia. La consigliera di Stato Carmelia Maissen ha spiegato che la fattura è stata inviata alla Regione Lombardia a metà maggio con scadenza a metà giugno, ma finora non è giunta alcuna risposta. La parte italiana aveva in precedenza prospettato solo 600'000 franchi. In caso di mancato pagamento, l'esecutivo retico discuterà come reagire.", "rilevanza": 58, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "cultura", "emoji": "🎭", "nome": "Cultura", "sommario": "Forte presenza ticinese con il bilancio del Locarno Film Festival e un volume sul festival organistico di Magadino (con la RSI tra i protagonisti). Sul fronte estero, il caso Bruel tocca direttamente la Svizzera, mentre Cannes, la morte di Edgar Morin e le nuove uscite discografiche completano il quadro.", "raccolte": 15, "stories": [{"titolo": "Locarno Film Festival: finanze solide e più collaborazione coi privati", "fonte": "RSI Cultura", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Locarno-Film-Festival-finanze-solide-e-pi%C3%B9-collaborazione-coi-privati--3775024.html", "riassunto": "Il festival ticinese chiude l'edizione 2025 in attivo e guarda al 2026 con un budget analogo. Per la prima volta il contributo dei privati supera quello pubblico, segno di un modello di finanziamento più diversificato. Tra gli ospiti annunciati il regista Darren Aronofsky e l'attrice Isabella Rossellini; l'edizione 2026 tornerà allo storico schermo di Piazza Grande progettato da Livio Vacchini, dopo la scelta impopolare di una struttura alternativa. Notizia di rilievo diretto per il Ticino.", "rilevanza": 92, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Patrick Bruel annulla il concerto a Pully e rinvia Friburgo dopo accuse di molestie", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/spettacoli/1929230/festival-concerto-pully-friburgo-bruel-molestie-accuse-patrick", "riassunto": "Il cantante francese non si esibirà in Svizzera questa estate: cancellato definitivamente il concerto al Pully Live Festival e rinviato quello al Bellarena Indoor Festival di Friburgo. La sua società di produzione parla della volontà di non turbare la serenità delle manifestazioni, citando pressioni sugli organizzatori. Sullo sfondo, indagini giudiziarie in Francia e Belgio per accuse di molestie e stupro. Le altre date del tour fuori dai festival restano confermate.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Magadino, 63 anni di musica: un libro racconta il Festival internazionale organistico", "fonte": "Ticinonews Magazine", "link": "https://www.ticinonews.ch/magazine/magadino-63-anni-di-musica-un-libro-racconta-il-festival-internazionale-organistico-432909", "riassunto": "Un volume di Giuseppe Clericetti, presentato l'11 maggio nella chiesa di San Carlo, celebra una delle rassegne organistiche più longeve d'Europa, nata nel 1963 sulle rive del Verbano. Il libro ripercorre la storia del festival e dell'organo, che oggi conta oltre 2300 canne e necessita di nuovi interventi. La RSI è citata come protagonista: le sue registrazioni hanno contribuito a diffondere il nome di Magadino oltre i confini nazionali. Notizia di interesse culturale ticinese.", "rilevanza": 80, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Cannes: seconda Palma d'oro per Cristian Mungiu con 'Fjord'", "fonte": "RSI Cultura", "link": "https://www.rsi.ch/info/cultura-e-spettacoli/Cannes-seconda-Palma-d%E2%80%99oro-per-Cristian-Mungiu--3764089.html", "riassunto": "Il regista rumeno Cristian Mungiu conquista la Palma d'oro della 79ma edizione del Festival di Cannes con 'Fjord', storia di una coppia rumeno-norvegese in un villaggio isolato. È il suo secondo trionfo dopo quello del 2007. L'edizione si è distinta per i premi all'interpretazione assegnati ex aequo a duetti maschili e femminili. Evento di rilievo internazionale, ben coperto con due articoli RSI.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Addio al sociologo e filosofo francese Edgar Morin", "fonte": "RSI Cultura", "link": "https://www.rsi.ch/info/cultura-e-spettacoli/Addio-al-sociologo-e-filosofo-francese-Edgar-Morin--3781483.html", "riassunto": "È morto a 104 anni Edgar Morin, figura di spicco della vita intellettuale francese, autore di un'opera vasta e conosciuta ben oltre i confini della Francia. Si definiva un 'bracconiere del sapere' e proponeva una riflessione sull'Uomo a partire dai dati della scienza, in controtendenza con la sociologia tradizionale. La notizia è stata data dall'AFP, che l'ha appresa dalla moglie.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 1, "vertot": 1}]}, {"key": "geopolitica", "emoji": "🌍", "nome": "Geopolitica & Esteri", "sommario": "Domina l'escalation in Medio Oriente: l'avanzata israeliana in Libano minaccia un attacco a Beirut, congelato all'ultimo dall'intervento USA, mentre l'Iran blocca i negoziati e i mercati asiatici ne risentono. Sul fronte europeo, accordo UE sul regolamento rimpatri con hub nei Paesi terzi; gli USA valutano armi nucleari in altri Stati NATO.", "raccolte": 246, "stories": [{"titolo": "Media, 'Israele stava per attaccare Beirut, fermato dagli Usa'", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/media-israele-stava-per-attaccare-beirut-fermato-dagli-usa_906dc61e-4d49-4a96-9b35-7bd5e8e57a20.html", "riassunto": "Secondo la tv pubblica israeliana Kan, Israele aveva pianificato un attacco su vasta scala contro la roccaforte di Hezbollah a Dahiyeh, alla periferia di Beirut, rinviato all'ultimo minuto per l'intervento americano. La notizia si incrocia con le dichiarazioni di Trump e Netanyahu della stessa giornata, che confermano i contatti diplomatici per evitare l'allargamento del conflitto. Il dato segnala quanto sia stato vicino il salto di scala militare in Libano, con il ruolo decisivo di Washington nel frenare l'operazione.", "rilevanza": 88, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Trump, ho parlato con Netanyahu, non ci saranno truppe a Beirut", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/trump-ho-parlato-con-netanyahu-non-ci-saranno-truppe-a-beirut_c8994d97-c1a6-449c-9784-c868f245bed7.html", "riassunto": "Trump annuncia su Truth una telefonata 'molto produttiva' con Netanyahu, escludendo l'invio di truppe verso Beirut, e riferisce di un contatto anche con Hezbollah, che avrebbe concordato il cessate il fuoco purché Israele non attacchi. Il presidente sostiene inoltre che i colloqui con l'Iran 'proseguono a ritmo serrato', in contrasto con altre fonti che danno i negoziati per bloccati. Le sue affermazioni vanno lette con cautela perché unilaterali e non confermate dalle controparti.", "rilevanza": 84, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Netanyahu, ho detto a Trump che colpiremo Beirut in caso di attacchi di Hezbollah", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/netanyahu-ho-detto-a-trump-che-colpiremo-beirut-in-caso-di-attacchi-di-hezbollah_46d87a90-7ce7-437f-83f0-8489be542e24.html", "riassunto": "Il premier israeliano Netanyahu, citato da Haaretz, riferisce di aver avvertito Trump che Israele colpirà obiettivi terroristici a Beirut se Hezbollah non smetterà di attaccare le città israeliane. Conferma inoltre che l'Idf continuerà a operare 'come previsto' nel Libano meridionale. La posizione, più dura del messaggio rassicurante di Trump, evidenzia la fragilità della tregua e la distanza tra le due narrazioni sullo stesso colloquio.", "rilevanza": 82, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Accordo in Ue sul regolamento rimpatri, sì agli hub in Paesi terzi", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/europa/2026/06/01/accordo-in-ue-sul-regolamento-rimpatri-si-agli-hub-in-paesi-terzi_45366dd2-9f4f-4325-9246-7053a7a3f3b9.html", "riassunto": "Parlamento europeo e Consiglio hanno trovato l'intesa in trilogo sul regolamento rimpatri, ultimo tassello del Patto Migrazione e Asilo. Le nuove norme impongono obblighi di cooperazione ai cittadini di Paesi terzi senza diritto di soggiorno e prevedono la creazione di hub per i rimpatri al di fuori dell'UE. L'accordo deve ancora passare il vaglio della commissione Libe e della plenaria. Dossier di interesse diretto per la Svizzera, parte dello spazio Schengen/Dublino e fortemente esposta alle politiche migratorie europee.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Ft, 'Usa stanno discutendo idea armi nucleari in altri Paesi Nato'", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/02/ft-usa-stanno-discutendo-idea-armi-nucleari-in-altri-paesi-nato_64d8077d-e4ca-494d-afd6-e4297b03f8d7.html", "riassunto": "Secondo il Financial Times, gli Stati Uniti starebbero valutando lo schieramento di armi nucleari in altri Stati membri della NATO in Europa, per rassicurare gli alleati dopo la riduzione del supporto militare convenzionale. I più interessati a ospitare basi DCA, con velivoli a duplice capacità, sarebbero Polonia e alcuni Stati baltici, sul fianco orientale dell'Alleanza. Una mossa che, se confermata, ridisegnerebbe gli equilibri di deterrenza in Europa, con riflessi sulla sicurezza dell'intero continente.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Trump, non mi importa se i negoziati con l'Iran sono finiti", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/trump-non-mi-importa-se-i-negoziati-con-liran-sono-finiti_7c114036-a6a7-4b93-bae2-0da9f15c77e9.html", "riassunto": "In un'intervista a Cnbc, Trump minimizza la possibile fine dei negoziati indiretti con l'Iran, bloccati da Teheran per protesta contro l'escalation israeliana in Libano: 'Non mi importa se sono finiti'. La frase contrasta con altre sue dichiarazioni dello stesso giorno secondo cui i colloqui 'proseguono a ritmo serrato', segnalando un messaggio diplomatico ambiguo. Lo stallo negoziale pesa sui mercati e alimenta l'incertezza sullo Stretto di Hormuz.", "rilevanza": 66, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Crosetto, 'in Libano come in Ucraina pace parta da fine ostilità'", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/mediooriente/2026/06/01/crosetto-in-libano-come-in-ucraina-pace-parta-da-fine-ostilita_a81f6f1d-a1b1-4fbd-90b2-6182c6ff9326.html", "riassunto": "Il ministro della Difesa italiano Guido Crosetto, intervenendo a Cinque Minuti, avverte che l'avanzata israeliana in Libano allontana un serio piano di pace, che deve partire dalla cessazione delle ostilità come in Ucraina. Sottolinea che il contingente italiano nell'Unifil non è in grado di assolvere il suo compito con una guerra in corso. Il punto tocca la tenuta della missione di pace ONU nel sud del Libano, dove operano anche militari di vari Paesi europei.", "rilevanza": 60, "rsi": false, "aff": true, "verok": 0, "vertot": 2}]}, {"key": "economia", "emoji": "💰", "nome": "Economia & Finanza", "sommario": "Dominano i temi svizzeri: l'inchiesta del MPC sul colosso ginevrino Gunvor per sospetta corruzione, due misure fiscali approvate alle Camere (soglia IVA e app QuickZoll) e gli equilibri del turismo (campeggi, Crans-Montana). Sullo sfondo il dibattito globale sulle valutazioni dei giganti dell'IA.", "raccolte": 15, "stories": [{"titolo": "Perquisita a Ginevra la sede di Gunvor per sospetta corruzione", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/cronaca/1929776/stata-gunvor-corruzione-ginevra-perquisita-sede", "riassunto": "La sede ginevrina del gigante delle materie prime Gunvor è stata perquisita a maggio dall'Ufficio federale di polizia su mandato del Ministero pubblico della Confederazione, nell'ambito di un procedimento contro ignoti per sospetta corruzione di pubblici ufficiali stranieri. Al centro, secondo l'ONG Public Eye, un contratto petrolifero in Gabon del 2024 con presunti pagamenti paralleli a intermediari in Africa. Gunvor respinge le accuse, dicendosi estranea e collaborativa. La società è però già stata condannata in Svizzera nel 2019 (Congo, Costa d'Avorio) e nel 2024 (Ecuador) per casi di corruzione.", "rilevanza": 88, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Ridurre a 150 franchi la soglia per il rimborso IVA, c'è il \"sì\" del Nazionale", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1929818/svizzera-franchi-soglia-nazionale-rimborso-iva", "riassunto": "Il Consiglio nazionale ha approvato con 128 voti contro 65 una mozione di Leo Müller (Centro/LU) per abbassare da 300 a 150 franchi la soglia minima di spesa necessaria a ottenere il rimborso dell'IVA, così da rilanciare il turismo degli acquisti e la competitività rispetto ai Paesi vicini. Le minori entrate fiscali sono stimate in circa due milioni di franchi, compensate secondo i promotori da maggiori acquisti. Karin Keller-Sutter, a favore, parla di armonizzazione con la soglia applicata agli svizzeri che comprano all'estero. Critico David Roth (PS/LU): benefici limitati a pochi settori e marchi di lusso. Il dossier passa agli Stati.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Con l'app QuickZoll per sdoganare la spesa si potrà selezionare l'aliquota ridotta", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/attualita/1929817/aliquota-beni-app-spesa-franchi", "riassunto": "L'Ufficio federale della dogana e della sicurezza dei confini (UDSC) ha aggiornato l'app QuickZoll consentendo di pagare anche con l'aliquota ridotta del 2,6%, quella sui beni di largo consumo, finora non disponibile a fronte del solo 8,1%. L'app, utilizzabile senza registrazione, permette di autodichiarare la spesa entro una finestra di due ore al confine. Da gennaio 2025 la soglia di esenzione IVA per gli acquisti oltre frontiera è fissata a 150 franchi al giorno per persona. L'uso è in forte crescita: dalle 13'000 dichiarazioni del 2018 a oltre 192'000 nel 2025, con 13 milioni di franchi di entrate.", "rilevanza": 68, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Campeggi, Swisscamps avverte: rischio affollamento dopo le chiusure", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/attualita/1929773/chiusure-swisscamps-pericoli-campeggi-rischio", "riassunto": "L'associazione dei proprietari Swisscamps avverte che le chiusure di campeggi per pericoli naturali, pur giuste dove i rischi sono immediati, rischiano di produrre sovraffollamento e camping selvaggio. In Vallese a inizio marzo la commissione edilizia cantonale ha sospeso l'attività di 13 campeggi per frane, colate detritiche ed erosione; altri casi a Gampelen (BE) e Zugo. Con una domanda turistica in crescita, la capacità ricettiva è destinata a ridursi e sostituire i posti persi è giudicato \"solo in misura limitata realistico\" per ostacoli normativi, costi elevati e lunghe procedure edilizie.", "rilevanza": 58, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "ai_openclaw", "emoji": "🤖", "nome": "AI & Tech", "sommario": "Settimana dominata da falle di sicurezza e dalle grandi manovre dell'AI: il chatbot di Meta apre la porta al furto di account Instagram, la Florida fa causa a OpenAI, Anthropic prepara l'IPO e papa Leone XIV dedica all'AI la sua prima enciclica. Sullo sfondo, incidenti spaziali (Blue Origin, Starship) e la corsa fallita di Microsoft.", "raccolte": 30, "stories": [{"titolo": "\"Il buco di sicurezza più stupido\": hacker prendono il controllo di account Instagram con una sola frase", "fonte": "Blick Digital", "link": "https://www.blick.ch/digital/duemmste-sicherheitsluecke-hacker-kapern-reihenweise-instagram-konten-mit-einem-satz-id21995630.html", "riassunto": "Il chatbot di supporto AI di Meta collegava un nuovo indirizzo email a un account Instagram altrui su semplice richiesta, inviando a quella mail il codice di conferma e permettendo agli aggressori di resettare la password ed escludere il vero proprietario. Tra i profili violati quello del Casa Bianca dell'era Obama (poi usato per un messaggio pro-iraniano), il sottufficiale più alto della US Space Force e la catena Sephora. Per aggirare il controllo geografico bastava una VPN; nemmeno l'autenticazione a due fattori proteggeva. Il ricercatore Siddharth Sundharam l'ha definita la falla più stupida mai vista; Meta l'ha poi chiusa.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Un'enciclica sulle intelligenze artificiali", "fonte": "Il Post Tecnologia", "link": "https://www.ilpost.it/2026/05/25/enciclica-leone-xiv-intelligenza-artificiale/", "riassunto": "Papa Leone XIV ha pubblicato \"Magnifica humanitas\", la prima enciclica del suo papato, interamente dedicata all'intelligenza artificiale, ai suoi rischi e ai dilemmi etici. Il testo, di quasi 36mila parole nella versione italiana, è rivolto soprattutto a politici e dirigenti delle grandi aziende AI: alla presentazione in Vaticano era presente il cofondatore di Anthropic Christopher Olah. Il papa richiama la torre di Babele come metafora del rischio di \"disumanizzazione\" e dell'idolatria del profitto, invitando a governare la tecnologia perché non aumenti le disparità.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "La Florida fa causa a OpenAI per problemi di sicurezza del chatbot", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/01/technology/florida-sues-openai-chatgpt-safety.html", "riassunto": "Secondo la descrizione, la Florida sarebbe il primo Stato USA a fare causa a OpenAI sostenendo che la sua tecnologia rappresenti un rischio per i minori e che l'azienda non abbia avvertito il pubblico dei pericoli. Il corpo dell'articolo non è disponibile, quindi non è possibile verificare dettagli, capi d'accusa o richieste: notizia da confermare su fonte primaria.", "rilevanza": 60, "rsi": false, "aff": false, "verok": 0, "vertot": 0}]}], "collezione": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "conteggio": 52, "items": [{"titolo": "Troppe prenotazioni fantasma nelle capanne del CAS", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/dialogo/Troppe-prenotazioni-fantasma-nelle-capanne-del-CAS--3787730.html"}, {"titolo": "La Svizzera vuole monitorare la radicalizzazione", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/La-Svizzera-vuole-monitorare-la-radicalizzazione--3793262.html"}, {"titolo": "Iniziativa UDC verso un “no” testa a testa sul servizio civile", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Iniziativa-UDC-verso-un-%E2%80%9Cno%E2%80%9D-testa-a-testa-sul-servizio-civile--3791861.html"}, {"titolo": "Piccaluga “Alleanza con l’UDC Incontri cruciali nelle prossime settimane”", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/in
