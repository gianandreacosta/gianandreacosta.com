<script id="data" type="application/json">[{"date_iso": "2026-06-03", "date_label": "Mercoledì 3 giugno 2026", "verifica": {"ver": 43, "tot": 57}, "totale": 1507, "n_analizzate": 30, "analisi": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "sommario": "Settimana dominata dal nodo dell'attuazione delle iniziative ticinesi sulle casse malati, mentre la cronaca registra un'emergenza su un bus nel Bellinzonese e tre arresti per furti a Chiasso. Sul piano federale spiccano la perquisizione a Gunvor per sospetta corruzione e gli aggiornamenti su dogana e ricerca.", "raccolte": 224, "stories": [{"titolo": "Iniziative casse malati, perizie e costi dividono i partiti", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Iniziative-casse-malati-perizie-e-costi-dividono-i-partiti--3793118.html", "riassunto": "La Commissione della Gestione del Gran Consiglio ticinese ha ricevuto due documenti chiave in vista della seduta di lunedì sull'attuazione delle due iniziative sulle casse malati (Lega e Sinistra). Una perizia del Centro per la Democrazia di Aarau (ZDA) affidata a un costituzionalista smentisce il Governo, concludendo che non si può vincolare l'entrata in vigore delle iniziative — approvate dal popolo lo scorso settembre — al loro finanziamento. Sull'iniziativa della Sinistra (tetto premi al 10% del reddito), i calcoli del Consiglio di Stato mostrano un costo di 300 milioni col premio medio di riferimento o 130 milioni con quello effettivo. Nodo politico di forte impatto cantonale.", "rilevanza": 88, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Bellinzonese, gas urticante sul bus: 3 persone all'ospedale", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Bellinzonese-gas-urticante-sul-bus-3-persone-all%E2%80%99ospedale--3792842.html", "riassunto": "Martedì pomeriggio, attorno alle 13:45, una sostanza urticante si è diffusa nell'abitacolo di un bus di linea a Galbisio, sulla tratta tra Castione e Monte Carasso, costringendo all'evacuazione del mezzo che trasportava una decina di persone. All'origine una bomboletta di gas urticante presente a bordo; alcuni passeggeri hanno accusato sintomi respiratori. Tre persone — due bambini e un adulto — sono state portate in ospedale per controlli, mentre una decina di passeggeri è stata visitata sul posto. La polizia ha chiuso temporaneamente la strada; le cause della fuoriuscita restano ignote.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Furti con scasso, tre arresti a Chiasso", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Furti-con-scasso-tre-arresti-a-Chiasso--3792911.html", "riassunto": "A Chiasso i collaboratori dell'Ufficio federale della dogana e della sicurezza dei confini hanno fermato due cittadini cileni di 26 e 21 anni residenti in Cile e un cubano 26enne residente in Italia, sospettati di una serie di furti con scasso in abitazioni nelle ultime settimane, secondo un comunicato congiunto di polizia cantonale e ministero pubblico. Nella loro auto con targhe italiane sono stati trovati attrezzi per lo scasso e refurtiva, parte della quale è stata recuperata. L'arresto è già stato confermato dal giudice dei provvedimenti coercitivi; i tre rispondono di furto con scasso, danneggiamento e violazione di domicilio.", "rilevanza": 80, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Sospetta corruzione, perquisita la sede di Gunvor a Ginevra", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Sospetta-corruzione-perquisita-la-sede-di-Gunvor-a-Ginevra--3792401.html", "riassunto": "La sede ginevrina del gigante delle materie prime Gunvor è stata perquisita dalla fedpol in maggio su mandato del Ministero pubblico della Confederazione (MPC), nell'ambito di un procedimento penale contro ignoti per sospetta corruzione di pubblici ufficiali stranieri. L'informazione, rivelata dall'ONG Public Eye e confermata a Keystone-ATS dal portavoce dell'MPC, riguarda un contratto petrolifero stipulato in Gabon nel 2024 in condizioni poco trasparenti e un presunto sistema di pagamenti paralleli a intermediari in Africa. Gunvor afferma di non essere direttamente coinvolta. La società è già stata condannata in Svizzera per corruzione nel 2019 (Congo e Costa d'Avorio) e nel 2024 (Ecuador).", "rilevanza": 68, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "QuickZoll tiene conto di entrambe le aliquote IVA", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/QuickZoll-tiene-conto-di-entrambe-le-aliquote-IVA--3792971.html", "riassunto": "L'Ufficio federale della dogana e della sicurezza dei confini ha aggiornato l'app QuickZoll, utile a chi entra in Svizzera con merci oltre i limiti di franchigia. La nuova versione consente di indicare separatamente il valore delle merci per le due aliquote IVA in vigore — quella normale dell'8,1% e quella ridotta del 2,6% — calcolando in automatico l'imposta dovuta e garantendo gli stessi vantaggi di una dichiarazione doganale formale. Lanciata nel 2018, l'app è passata da 13'000 dichiarazioni nel primo anno alle 192'000 del 2025, per 13 milioni di franchi di entrate. Tema rilevante per i frontalieri ticinesi.", "rilevanza": 60, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "cronaca_svizzera", "emoji": "🇨🇭", "nome": "Cronaca Svizzera", "sommario": "Settimana dominata dai temi migratori e identitari: la revoca della cittadinanza all'aggressore di Winterthur e il sondaggio sulla crescita demografica a ridosso del voto sull'iniziativa UDC. In evidenza anche il sostegno svizzero alla ricostruzione dell'Ucraina, casi di consumo e frodi (brushing Amazon, lingotti d'oro falsi) e lo strascico finanziario dei Giochi di Milano-Cortina nei Grigioni.", "raccolte": 170, "stories": [{"titolo": "La revoca della cittadinanza all'aggressore di Winterthur è una «decisione affrettata»", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/la-revoca-della-cittadinanza-allaggressore-di-winterthur-e-una-decisione-affrettata-429189", "riassunto": "Il dibattito sulla revoca della cittadinanza allo svizzero-turco autore dell'aggressione a coltellate di Winterthur (ZH) si fa acceso. La Segreteria di Stato della migrazione precisa che il provvedimento richiede una sentenza definitiva per reati gravissimi (terrorismo, crimini contro l'umanità, criminalità organizzata) e che negli ultimi anni dieci procedure simili hanno portato a sette revoche. Il giurista Alberto Achermann (Università di Berna) giudica «affrettata» la richiesta avanzata dal direttore della sicurezza zurighese Mario Fehr, perché non è ancora accertata la responsabilità penale dell'autore, che dovrebbe poi essere espulso in Turchia.", "rilevanza": 90, "rsi": true, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Due svizzeri su tre favorevoli alle misure per frenare la popolazione", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/due-svizzeri-su-tre-favorevoli-alle-misure-per-frenare-la-popolazione-429479", "riassunto": "A meno di due settimane dal voto sull'iniziativa dell'UDC, un sondaggio Demoscope per Infosperber (1.110 aventi diritto, 21-31 maggio 2026) mostra una popolazione preoccupata dalla prospettiva dei 10 milioni di abitanti. Il 51% considera problematica una Svizzera oltre quella soglia e solo il 39% la immagine fattibile tra trent'anni. Il 62% sarebbe favorevole a misure per frenare la crescita demografica anche mantenendo la libera circolazione. Il sostegno è più forte nella Svizzera tedesca (66%) che in Romandia (51%), con uomini più favorevoli delle donne.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "«La ricostruzione dell'Ucraina deve coinvolgere maggiormente il settore privato svizzero»", "fonte": "Ticinonews Svizzera", "link": "https://www.ticinonews.ch/svizzera/la-ricostruzione-dellucraina-deve-coinvolgere-maggiormente-il-settore-privato-svizzero-434819", "riassunto": "Il Consiglio nazionale ha approvato con 148 voti a 9 e 38 astensioni un accordo con Kiev che apre la ricostruzione dell'Ucraina alle imprese svizzere, soprattutto in ambito energetico e infrastrutturale. Gli aiuti sono a fondo perso: Kiev definirà un elenco di beni e servizi che la Svizzera acquisterà da aziende elvetiche escludendo i fornitori stranieri. Per il programma 2025-2028 sono previsti 1,5 miliardi di franchi, mentre tra il 2025 e il 2036 lo stanziamento complessivo salirà a cinque miliardi. La Camera ha inoltre approvato all'unanimità l'aggiornamento dell'accordo di libero scambio AELS-Ucraina.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Riceve pacchi Amazon ogni giorno senza aver ordinato nulla: il mistero del «brushing»", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/svizzera/riceve-pacchi-amazon-ogni-giorno-senza-aver-ordinato-nulla-il-mistero-del-brushing-427858", "riassunto": "Una famiglia di Bienne ha ricevuto per settimane pacchi Amazon mai ordinati, dagli oggetti più disparati: penne a sfera, copriscarpe per sale operatorie, libri da colorare. Al centro un diciassettenne che due anni fa aveva aperto un account senza acquisti, poi bloccato per «attività sospette». Nonostante i ripetuti contatti con il servizio clienti, le consegne sono continuate. Amazon, senza commentare il caso, indica come possibile spiegazione il «brushing», pratica fraudolenta per pubblicare false recensioni inviando prodotti economici a indirizzi ottenuti illegalmente. Il caso è emerso grazie a RTS e alla trasmissione SRF «Espresso».", "rilevanza": 68, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Lanciata l'iniziativa per una maggiore sicurezza digitale", "fonte": "RSI Svizzera", "link": "https://www.rsi.ch/info/svizzera/Lanciata-l%E2%80%99iniziativa-per-una-maggiore-sicurezza-digitale--3791825.html", "riassunto": "L'associazione Swiss Digital Pact ha zione coi privati", "fonte": "RSI Cultura", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Locarno-Film-Festival-finanze-solide-e-pi%C3%B9-collaborazione-coi-privati--3775024.html", "riassunto": "Il festival ticinese chiude l'edizione 2025 in attivo e guarda al 2026 con un budget analogo. Per la prima volta il contributo dei privati supera quello pubblico, segno di un modello di finanziamento più diversificato. Tra gli ospiti annunciati il regista Darren Aronofsky e l'attrice Isabella Rossellini; l'edizione 2026 tornerà allo storico schermo di Piazza Grande progettato da Livio Vacchini, dopo la scelta impopolare di una struttura alternativa. Notizia di rilievo diretto per il Ticino.", "rilevanza": 92, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Patrick Bruel annulla il concerto a Pully e rinvia Friburgo dopo accuse di molestie", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/spettacoli/1929230/festival-concerto-pully-friburgo-bruel-molestie-accuse-patrick", "riassunto": "Il cantante francese non si esibirà in Svizzera questa estate: cancellato definitivamente il concerto al Pully Live Festival e rinviato quello al Bellarena Indoor Festival di Friburgo. La sua società di produzione parla della volontà di non turbare la serenità delle manifestazioni, citando pressioni sugli organizzatori. Sullo sfondo, indagini giudiziarie in Francia e Belgio per accuse di molestie e stupro. Le altre date del tour fuori dai festival restano confermate.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Magadino, 63 anni di musica: un libro racconta il Festival internazionale organistico", "fonte": "Ticinonews Magazine", "link": "https://www.ticinonews.ch/magazine/magadino-63-anni-di-musica-un-libro-racconta-il-festival-internazionale-organistico-432909", "riassunto": "Un volume di Giuseppe Clericetti, presentato l'11 maggio nella chiesa di San Carlo, celebra una delle rassegne organistiche più longeve d'Europa, nata nel 1963 sulle rive del Verbano. Il libro ripercorre la storia del festival e dell'organo, che oggi conta oltre 2300 canne e necessita di nuovi interventi. La RSI è citata come protagonista: le sue registrazioni hanno contribuito a diffondere il nome di Magadino oltre i confini nazionali. Notizia di interesse culturale ticinese.", "rilevanza": 80, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Cannes: seconda Palma d'oro per Cristian Mungiu con 'Fjord'", "fonte": "RSI Cultura", "link": "https://www.rsi.ch/info/cultura-e-spettacoli/Cannes-seconda-Palma-d%E2%80%99oro-per-Cristian-Mungiu--3764089.html", "riassunto": "Il regista rumeno Cristian Mungiu conquista la Palma d'oro della 79ma edizione del Festival di Cannes con 'Fjord', storia di una coppia rumeno-norvegese in un villaggio isolato. È il suo secondo trionfo dopo quello del 2007. L'edizione si è distinta per i premi all'interpretazione assegnati ex aequo a duetti maschili e femminili. Evento di rilievo internazionale, ben coperto con due articoli RSI.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Addio al sociologo e filosofo francese Edgar Morin", "fonte": "RSI Cultura", "link": "https://www.rsi.ch/info/cultura-e-spettacoli/Addio-al-sociologo-e-filosofo-francese-Edgar-Morin--3781483.html", "riassunto": "È morto a 104 anni Edgar Morin, figura di spicco della vita intellettuale francese, autore di un'opera vasta e conosciuta ben oltre i confini della Francia. Si definiva un 'bracconiere del sapere' e proponeva una riflessione sull'Uomo a partire dai dati della scienza, in controtendenza con la sociologia tradizionale. La notizia è stata data dall'AFP, che l'ha appresa dalla moglie.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 1, "vertot": 1}]}, {"key": "geopolitica", "emoji": "🌍", "nome": "Geopolitica & Esteri", "sommario": "Domina l'escalation in Medio Oriente: l'avanzata israeliana in Libano minaccia un attacco a Beirut, congelato all'ultimo dall'intervento USA, mentre l'Iran blocca i negoziati e i mercati asiatici ne risentono. Sul fronte europeo, accordo UE sul regolamento rimpatri con hub nei Paesi terzi; gli USA valutano armi nucleari in altri Stati NATO.", "raccolte": 817, "stories": [{"titolo": "Media, 'Israele stava per attaccare Beirut, fermato dagli Usa'", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/media-israele-stava-per-attaccare-beirut-fermato-dagli-usa_906dc61e-4d49-4a96-9b35-7bd5e8e57a20.html", "riassunto": "Secondo la tv pubblica israeliana Kan, Israele aveva pianificato un attacco su vasta scala contro la roccaforte di Hezbollah a Dahiyeh, alla periferia di Beirut, rinviato all'ultimo minuto per l'intervento americano. La notizia si incrocia con le dichiarazioni di Trump e Netanyahu della stessa giornata, che confermano i contatti diplomatici per evitare l'allargamento del conflitto. Il dato segnala quanto sia stato vicino il salto di scala militare in Libano, con il ruolo decisivo di Washington nel frenare l'operazione.", "rilevanza": 88, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Trump, ho parlato con Netanyahu, non ci saranno truppe a Beirut", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/trump-ho-parlato-con-netanyahu-non-ci-saranno-truppe-a-beirut_c8994d97-c1a6-449c-9784-c868f245bed7.html", "riassunto": "Trump annuncia su Truth una telefonata 'molto produttiva' con Netanyahu, escludendo l'invio di truppe verso Beirut, e riferisce di un contatto anche con Hezbollah, che avrebbe concordato il cessate il fuoco purché Israele non attacchi. Il presidente sostiene inoltre che i colloqui con l'Iran 'proseguono a ritmo serrato', in contrasto con altre fonti che danno i negoziati per bloccati. Le sue affermazioni vanno lette con cautela perché unilaterali e non confermate dalle controparti.", "rilevanza": 84, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Netanyahu, ho detto a Trump che colpiremo Beirut in caso di attacchi di Hezbollah", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/netanyahu-ho-detto-a-trump-che-colpiremo-beirut-in-caso-di-attacchi-di-hezbollah_46d87a90-7ce7-437f-83f0-8489be542e24.html", "riassunto": "Il premier israeliano Netanyahu, citato da Haaretz, riferisce di aver avvertito Trump che Israele colpirà obiettivi terroristici a Beirut se Hezbollah non smetterà di attaccare le città israeliane. Conferma inoltre che l'Idf continuerà a operare 'come previsto' nel Libano meridionale. La posizione, più dura del messaggio rassicurante di Trump, evidenzia la fragilità della tregua e la distanza tra le due narrazioni sullo stesso colloquio.", "rilevanza": 82, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Accordo in Ue sul regolamento rimpatri, sì agli hub in Paesi terzi", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/europa/2026/06/01/accordo-in-ue-sul-regolamento-rimpatri-si-agli-hub-in-paesi-terzi_45366dd2-9f4f-4325-9246-7053a7a3f3b9.html", "riassunto": "Parlamento europeo e Consiglio hanno trovato l'intesa in trilogo sul regolamento rimpatri, ultimo tassello del Patto Migrazione e Asilo. Le nuove norme impongono obblighi di cooperazione ai cittadini di Paesi terzi senza diritto di soggiorno e prevedono la creazione di hub per i rimpatri al di fuori dell'UE. L'accordo deve ancora passare il vaglio della commissione Libe e della plenaria. Dossier di interesse diretto per la Svizzera, parte dello spazio Schengen/Dublino e fortemente esposta alle politiche migratorie europee.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Ft, 'Usa stanno discutendo idea armi nucleari in altri Paesi Nato'", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/02/ft-usa-stanno-discutendo-idea-armi-nucleari-in-altri-paesi-nato_64d8077d-e4ca-494d-afd6-e4297b03f8d7.html", "riassunto": "Secondo il Financial Times, gli Stati Uniti starebbero valutando lo schieramento di armi nucleari in altri Stati membri della NATO in Europa, per rassicurare gli alleati dopo la riduzione del supporto militare convenzionale. I più interessati a ospitare basi DCA, con velivoli a duplice capacità, sarebbero Polonia e alcuni Stati baltici, sul fianco orientale dell'Alleanza. Una mossa che, se confermata, ridisegnerebbe gli equilibri di deterrenza in Europa, con riflessi sulla sicurezza dell'intero continente.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Trump, non mi importa se i negoziati con l'Iran sono finiti", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/trump-non-mi-importa-se-i-negoziati-con-liran-sono-finiti_7c114036-a6a7-4b93-bae2-0da9f15c77e9.html", "riassunto": "In un'intervista a Cnbc, Trump minimizza la possibile fine dei negoziati indiretti con l'Iran, bloccati da Teheran per protesta contro l'escalation israeliana in Libano: 'Non mi importa se sono finiti'. La frase contrasta con altre sue dichiarazioni dello stesso giorno secondo cui i colloqui 'proseguono a ritmo serrato', segnalando un messaggio diplomatico ambiguo. Lo stallo negoziale pesa sui mercati e alimenta l'incertezza sullo Stretto di Hormuz.", "rilevanza": 66, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Crosetto, 'in Libano come in Ucraina pace parta da fine ostilità'", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/mediooriente/2026/06/01/crosetto-in-libano-come-in-ucraina-pace-parta-da-fine-ostilita_a81f6f1d-a1b1-4fbd-90b2-6182c6ff9326.html", "riassunto": "Il ministro della Difesa italiano Guido Crosetto, intervenendo a Cinque Minuti, avverte che l'avanzata israeliana in Libano allontana un serio piano di pace, che deve partire dalla cessazione delle ostilità come in Ucraina. Sottolinea che il contingente italiano nell'Unifil non è in grado di assolvere il suo compito con una guerra in corso. Il punto tocca la tenuta della missione di pace ONU nel sud del Libano, dove operano anche militari di vari Paesi europei.", "rilevanza": 60, "rsi": false, "aff": true, "verok": 0, "vertot": 2}]}, {"key": "economia", "emoji": "💰", "nome": "Economia & Finanza", "sommario": "Dominano i temi svizzeri: l'inchiesta del MPC sul colosso ginevrino Gunvor per sospetta corruzione, due misure fiscali approvate alle Camere (soglia IVA e app QuickZoll) e gli equilibri del turismo (campeggi, Crans-Montana). Sullo sfondo il dibattito globale sulle valutazioni dei giganti dell'IA.", "raccolte": 82, "stories": [{"titolo": "Perquisita a Ginevra la sede di Gunvor per sospetta corruzione", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/cronaca/1929776/stata-gunvor-corruzione-ginevra-perquisita-sede", "riassunto": "La sede ginevrina del gigante delle materie prime Gunvor è stata perquisita a maggio dall'Ufficio federale di polizia su mandato del Ministero pubblico della Confederazione, nell'ambito di un procedimento contro ignoti per sospetta corruzione di pubblici ufficiali stranieri. Al centro, secondo l'ONG Public Eye, un contratto petrolifero in Gabon del 2024 con presunti pagamenti paralleli a intermediari in Africa. Gunvor respinge le accuse, dicendosi estranea e collaborativa. La società è però già stata condannata in Svizzera nel 2019 (Congo, Costa d'Avorio) e nel 2024 (Ecuador) per casi di corruzione.", "rilevanza": 88, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Ridurre a 150 franchi la soglia per il rimborso IVA, c'è il \"sì\" del Nazionale", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1929818/svizzera-franchi-soglia-nazionale-rimborso-iva", "riassunto": "Il Consiglio nazionale ha approvato con 128 voti contro 65 una mozione di Leo Müller (Centro/LU) per abbassare da 300 a 150 franchi la soglia minima di spesa necessaria a ottenere il rimborso dell'IVA, così da rilanciare il turismo degli acquisti e la competitività rispetto ai Paesi vicini. Le minori entrate fiscali sono stimate in circa due milioni di franchi, compensate secondo i promotori da maggiori acquisti. Karin Keller-Sutter, a favore, parla di armonizzazione con la soglia applicata agli svizzeri che comprano all'estero. Critico David Roth (PS/LU): benefici limitati a pochi settori e marchi di lusso. Il dossier passa agli Stati.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Con l'app QuickZoll per sdoganare la spesa si potrà selezionare l'aliquota ridotta", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/attualita/1929817/aliquota-beni-app-spesa-franchi", "riassunto": "L'Ufficio federale della dogana e della sicurezza dei confini (UDSC) ha aggiornato l'app QuickZoll consentendo di pagare anche con l'aliquota ridotta del 2,6%, quella sui beni di largo consumo, finora non disponibile a fronte del solo 8,1%. L'app, utilizzabile senza registrazione, permette di autodichiarare la spesa entro una finestra di due ore al confine. Da gennaio 2025 la soglia di esenzione IVA per gli acquisti oltre frontiera è fissata a 150 franchi al giorno per persona. L'uso è in forte crescita: dalle 13'000 dichiarazioni del 2018 a oltre 192'000 nel 2025, con 13 milioni di franchi di entrate.", "rilevanza": 68, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Campeggi, Swisscamps avverte: rischio affollamento dopo le chiusure", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/attualita/1929773/chiusure-swisscamps-pericoli-campeggi-rischio", "riassunto": "L'associazione dei proprietari Swisscamps avverte che le chiusure di campeggi per pericoli naturali, pur giuste dove i rischi sono immediati, rischiano di produrre sovraffollamento e camping selvaggio. In Vallese a inizio marzo la commissione edilizia cantonale ha sospeso l'attività di 13 campeggi per frane, colate detritiche ed erosione; altri casi a Gampelen (BE) e Zugo. Con una domanda turistica in crescita, la capacità ricettiva è destinata a ridursi e sostituire i posti persi è giudicato \"solo in misura limitata realistico\" per ostacoli normativi, costi elevati e lunghe procedure edilizie.", "rilevanza": 58, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "ai_openclaw", "emoji": "🤖", "nome": "AI & Tech", "sommario": "Settimana dominata da falle di sicurezza e dalle grandi manovre dell'AI: il chatbot di Meta apre la porta al furto di account Instagram, la Florida fa causa a OpenAI, Anthropic prepara l'IPO e papa Leone XIV dedica all'AI la sua prima enciclica. Sullo sfondo, incidenti spaziali (Blue Origin, Starship) e la corsa fallita di Microsoft.", "raccolte": 87, "stories": [{"titolo": "\"Il buco di sicurezza più stupido\": hacker prendono il controllo di account Instagram con una sola frase", "fonte": "Blick Digital", "link": "https://www.blick.ch/digital/duemmste-sicherheitsluecke-hacker-kapern-reihenweise-instagram-konten-mit-einem-satz-id21995630.html", "riassunto": "Il chatbot di supporto AI di Meta collegava un nuovo indirizzo email a un account Instagram altrui su semplice richiesta, inviando a quella mail il codice di conferma e permettendo agli aggressori di resettare la password ed escludere il vero proprietario. Tra i profili violati quello del Casa Bianca dell'era Obama (poi usato per un messaggio pro-iraniano), il sottufficiale più alto della US Space Force e la catena Sephora. Per aggirare il controllo geografico bastava una VPN; nemmeno l'autenticazione a due fattori proteggeva. Il ricercatore Siddharth Sundharam l'ha definita la falla più stupida mai vista; Meta l'ha poi chiusa.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Un'enciclica sulle intelligenze artificiali", "fonte": "Il Post Tecnologia", "link": "https://www.ilpost.it/2026/05/25/enciclica-leone-xiv-intelligenza-artificiale/", "riassunto": "Papa Leone XIV ha pubblicato \"Magnifica humanitas\", la prima enciclica del suo papato, interamente dedicata all'intelligenza artificiale, ai suoi rischi e ai dilemmi etici. Il testo, di quasi 36mila parole nella versione italiana, è rivolto soprattutto a politici e dirigenti delle grandi aziende AI: alla presentazione in Vaticano era presente il cofondatore di Anthropic Christopher Olah. Il papa richiama la torre di Babele come metafora del rischio di \"disumanizzazione\" e dell'idolatria del profitto, invitando a governare la tecnologia perché non aumenti le disparità.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "La Florida fa causa a OpenAI per problemi di sicurezza del chatbot", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/01/technology/florida-sues-openai-chatgpt-safety.html", "riassunto": "Secondo la descrizione, la Florida sarebbe il primo Stato USA a fare causa a OpenAI sostenendo che la sua tecnologia rappresenti un rischio per i minori e che l'azienda non abbia avvertito il pubblico dei pericoli. Il corpo dell'articolo non è disponibile, quindi non è possibile verificare dettagli, capi d'accusa o richieste: notizia da confermare su fonte primaria.", "rilevanza": 60, "rsi": false, "aff": false, "verok": 0, "vertot": 0}]}], "collezione": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "conteggio": 224, "items": [{"titolo": "Lucciole la loro luce risale ai dinosauri", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/natura-e-animali/Lucciole-la-loro-luce-risale-ai-dinosauri--3775970.html"}, {"titolo": "Le esportazioni elvetiche ristagnano in aprile", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/economia/Le-esportazioni-elvetiche-ristagnano-in-aprile--3791966.html"}, {"titolo": "Più controlli e una tassa in più sugli acquisti online dai giganti asiatici", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Pi%C3%B9-controlli-e-una-tassa-in-pi%C3%B rdi di dollari con un multiplo ARR di 80 volte, nonostante le perdite operative", "fonte": "TechCrunch AI", "link": "https://techcrunch.com/2026/06/02/cyera-eyes-12b-valuation-at-80x-arr-multiple-despite-operating-losses/"}, {"titolo": "Uber limita la spesa per l'intelligenza artificiale dei dipendenti dopo aver superato il budget in 4 mesi", "fonte": "TechCrunch AI", "link": "https://techcrunch.com/2026/06/02/uber-caps-employee-ai-spending-after-blowing-through-budget-in-four-months/"}, {"titolo": "Il nuovo strumento Microsoft consente agli sviluppatori di avviare test sul comportamento dell'intelligenza artificiale utilizzando descrizioni di testo", "fonte": "TechCrunch AI", "link": "https://techcrunch.com/2026/06/02/new-microsoft-tool-lets-devs-spin-up-ai-behavior-tests-using-text-descriptions/"}]}]}, {"date_iso": "2026-06-02", "date_label": "Martedì 2 giugno 2026", "verifica": {"ver": 57, "tot": 57}, "totale": 1113, "n_analizzate": 30, "analisi": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "sommario": "Settimana dominata dal nodo dell'attuazione delle iniziative ticinesi sulle casse malati, mentre la cronaca registra un'emergenza su un bus nel Bellinzonese e tre arresti per furti a Chiasso. Sul piano federale spiccano la perquisizione a Gunvor per sospetta corruzione e gli aggiornamenti su dogana e ricerca.", "raccolte": 172, "stories": [{"titolo": "Iniziative casse malati, perizie e costi dividono i partiti", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Iniziative-casse-malati-perizie-e-costi-dividono-i-partiti--3793118.html", "riassunto": "La Commissione della Gestione del Gran Consiglio ticinese ha ricevuto due documenti chiave in vista della seduta di lunedì sull'attuazione delle due iniziative sulle casse malati (Lega e Sinistra). Una perizia del Centro per la Democrazia di Aarau (ZDA) affidata a un costituzionalista smentisce il Governo, concludendo che non si può vincolare l'entrata in vigore delle iniziative — approvate dal popolo lo scorso settembre — al loro finanziamento. Sull'iniziativa della Sinistra (tetto premi al 10% del reddito), i calcoli del Consiglio di Stato mostrano un costo di 300 milioni col premio medio di riferimento o 130 milioni con quello effettivo. Nodo politico di forte impatto cantonale.", "rilevanza": 88, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Bellinzonese, gas urticante sul bus: 3 persone all'ospedale", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Bellinzonese-gas-urticante-sul-bus-3-persone-all%E2%80%99ospedale--3792842.html", "riassunto": "Martedì pomeriggio, attorno alle 13:45, una sostanza urticante si è diffusa nell'abitacolo di un bus di linea a Galbisio, sulla tratta tra Castione e Monte Carasso, costringendo all'evacuazione del mezzo che trasportava una decina di persone. All'origine una bomboletta di gas urticante presente a bordo; alcuni passeggeri hanno accusato sintomi respiratori. Tre persone — due bambini e un adulto — sono state portate in ospedale per controlli, mentre una decina di passeggeri è stata visitata sul posto. La polizia ha chiuso temporaneamente la strada; le cause della fuoriuscita restano ignote.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Furti con scasso, tre arresti a Chiasso", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Furti-con-scasso-tre-arresti-a-Chiasso--3792911.html", "riassunto": "A Chiasso i collaboratori dell'Ufficio federale della dogana e della sicurezza dei confini hanno fermato due cittadini cileni di 26 e 21 anni residenti in Cile e un cubano 26enne residente in Italia, sospettati di una serie di furti con scasso in abitazioni nelle ultime settimane, secondo un comunicato congiunto di polizia cantonale e ministero pubblico. Nella loro auto con targhe italiane sono stati trovati attrezzi per lo scasso e refurtiva, parte della quale è stata recuperata. L'arresto è già stato confermato dal giudice dei provvedimenti coercitivi; i tre rispondono di furto con scasso, danneggiamento e violazione di domicilio.", "rilevanza": 80, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Sospetta corruzione, perquisita la sede di Gunvor a Ginevra", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Sospetta-corruzione-perquisita-la-sede-di-Gunvor-a-Ginevra--3792401.html", "riassunto": "La sede ginevrina del gigante delle materie prime Gunvor è stata perquisita dalla fedpol in maggio su mandato del Ministero pubblico della Confederazione (MPC), nell'ambito di un procedimento penale contro ignoti per sospetta corruzione di pubblici ufficiali stranieri. L'informazione, rivelata dall'ONG Public Eye e confermata a Keystone-ATS dal portavoce dell'MPC, riguarda un contratto petrolifero stipulato in Gabon nel 2024 in condizioni poco trasparenti e un presunto sistema di pagamenti paralleli a intermediari in Africa. Gunvor afferma di non essere direttamente coinvolta. La società è già stata condannata in Svizzera per corruzione nel 2019 (Congo e Costa d'Avorio) e nel 2024 (Ecuador).", "rilevanza": 68, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "QuickZoll tiene conto di entrambe le aliquote IVA", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/QuickZoll-tiene-conto-di-entrambe-le-aliquote-IVA--3792971.html", "riassunto": "L'Ufficio federale della dogana e della sicurezza dei confini ha aggiornato l'app QuickZoll, utile a chi entra in Svizzera con merci oltre i limiti di franchigia. La nuova versione consente di indicare separatamente il valore delle merci per le due aliquote IVA in vigore — quella normale dell'8,1% e quella ridotta del 2,6% — calcolando in automatico l'imposta dovuta e garantendo gli stessi vantaggi di una dichiarazione doganale formale. Lanciata nel 2018, l'app è passata da 13'000 dichiarazioni nel primo anno alle 192'000 del 2025, per 13 milioni di franchi di entrate. Tema rilevante per i frontalieri ticinesi.", "rilevanza": 60, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "cronaca_svizzera", "emoji": "🇨🇭", "nome": "Cronaca Svizzera", "sommario": "Settimana dominata dai temi migratori e identitari: la revoca della cittadinanza all'aggressore di Winterthur e il sondaggio sulla crescita demografica a ridosso del voto sull'iniziativa UDC. In evidenza anche il sostegno svizzero alla ricostruzione dell'Ucraina, casi di consumo e frodi (brushing Amazon, lingotti d'oro falsi) e lo strascico finanziario dei Giochi di Milano-Cortina nei Grigioni.", "raccolte": 134, "stories": [{"titolo": "La revoca della cittadinanza all'aggressore di Winterthur è una «decisione affrettata»", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/la-revoca-della-cittadinanza-allaggressore-di-winterthur-e-una-decisione-affrettata-429189", "riassunto": "Il dibattito sulla revoca della cittadinanza allo svizzero-turco autore dell'aggressione a coltellate di Winterthur (ZH) si fa acceso. La Segreteria di Stato della migrazione precisa che il provvedimento richiede una sentenza definitiva per reati gravissimi (terrorismo, crimini contro l'umanità, criminalità organizzata) e che negli ultimi anni dieci procedure simili hanno portato a sette revoche. Il giurista Alberto Achermann (Università di Berna) giudica «affrettata» la richiesta avanzata dal direttore della sicurezza zurighese Mario Fehr, perché non è ancora accertata la responsabilità penale dell'autore, che dovrebbe poi essere espulso in Turchia.", "rilevanza": 90, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Due svizzeri su tre favorevoli alle misure per frenare la popolazione", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/due-svizzeri-su-tre-favorevoli-alle-misure-per-frenare-la-popolazione-429479", "riassunto": "A meno di due settimane dal voto sull'iniziativa dell'UDC, un sondaggio Demoscope per Infosperber (1.110 aventi diritto, 21-31 maggio 2026) mostra una popolazione preoccupata dalla prospettiva dei 10 milioni di abitanti. Il 51% considera problematica una Svizzera oltre quella soglia e solo il 39% la immagine fattibile tra trent'anni. Il 62% sarebbe favorevole a misure per frenare la crescita demografica anche mantenendo la libera circolazione. Il sostegno è più forte nella Svizzera tedesca (66%) che in Romandia (51%), con uomini più favorevoli delle donne.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "«La ricostruzione dell'Ucraina deve coinvolgere maggiormente il settore privato svizzero»", "fonte": "Ticinonews Svizzera", "link": "https://www.ticinonews.ch/svizzera/la-ricostruzione-dellucraina-deve-coinvolgere-maggiormente-il-settore-privato-svizzero-434819", "riassunto": "Il Consiglio nazionale ha approvato con 148 voti a 9 e 38 astensioni un accordo con Kiev che apre la ricostruzione dell'Ucraina alle imprese svizzere, soprattutto in ambito energetico e infrastrutturale. Gli aiuti sono a fondo perso: Kiev definirà un elenco di beni e servizi che la Svizzera acquisterà da aziende elvetiche escludendo i fornitori stranieri. Per il programma 2025-2028 sono previsti 1,5 miliardi di franchi, mentre tra il 2025 e il 2036 lo stanziamento complessivo salirà a cinque miliardi. La Camera ha inoltre approvato all'unanimità l'aggiornamento dell'accordo di libero scambio AELS-Ucraina.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Riceve pacchi Amazon ogni giorno senza aver ordinato nulla: il mistero del «brushing»", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/svizzera/riceve-pacchi-amazon-ogni-giorno-senza-aver-ordinato-nulla-il-mistero-del-brushing-427858", "riassunto": "Una famiglia di Bienne ha ricevuto per settimane pacchi Amazon mai ordinati, dagli oggetti più disparati: penne a sfera, copriscarpe per sale operatorie, libri da colorare. Al centro un diciassettenne che due anni fa aveva aperto un account senza acquisti, poi bloccato per «attività sospette». Nonostante i ripetuti contatti con il servizio clienti, le consegne sono continuate. Amazon, senza commentare il caso, indica come possibile spiegazione il «brushing», pratica fraudolenta per pubblicare false recensioni inviando prodotti economici a indirizzi ottenuti illegalmente. Il caso è emerso grazie a RTS e alla trasmissione SRF «Espresso».", "rilevanza": 68, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Lanciata l'iniziativa per una maggiore sicurezza digitale", "fonte": "RSI Svizzera", "link": "https://www.rsi.ch/info/svizzera/Lanciata-l%E2%80%99iniziativa-per-una-maggiore-sicurezza-digitale--3791825.html", "riassunto": "L'associazione Swiss Digital Pact ha lanciato l'iniziativa popolare «Per la sicurezza digitale della Svizzera», che chiede alla Confederazione di garantire resilienza e sovranità digitale a livello costituzionale. Il comitato vuole disposizioni di sicurezza vincolanti per tutti gli attori del settore, pubblici e privati, oltre alla protezione dei dati personali e alla promozione delle competenze digitali. Il presidente Gérald Vernez chiede che la sicurezza digitale sia riconosciuta come «missione centrale dello Stato». L'associazione si dichiara indipendente da qualsiasi partito.", "rilevanza": 60, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Traffico olimpico nei Grigioni, finora ancora nessuna risposta da parte italiana", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/traffico-olimpico-nei-grigioni-finora-ancora-nessuna-risposta-da-parte-italiana-429458", "riassunto": "La gestione della viabilità durante i Giochi olimpici di Milano-Cortina dello scorso febbraio è costata 3,5 milioni di franchi al Canton Grigioni, che intende farsi carico solo di circa 0,9 milioni e ha fatturato i restanti 2,6 milioni all'Italia. La consigliera di Stato Carmelia Maissen ha spiegato che la fattura è stata inviata alla Regione Lombardia a metà maggio con scadenza a metà giugno, ma finora non è giunta alcuna risposta. La parte italiana aveva in precedenza prospettato solo 600'000 franchi. In caso di mancato pagamento, l'esecutivo retico discuterà come reagire.", "rilevanza": 58, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "cultura", "emoji": "🎭", "nome": "Cultura", "sommario": "Forte presenza ticinese con il bilancio del Locarno Film Festival e un volume sul festival organistico di Magadino (con la RSI tra i protagonisti). Sul fronte estero, il caso Bruel tocca direttamente la Svizzera, mentre Cannes, la morte di Edgar Morin e le nuove uscite discografiche completano il quadro.", "raccolte": 112, "stories": [{"titolo": "Locarno Film Festival: finanze solide e più collaborazione coi privati", "fonte": "RSI Cultura", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Locarno-Film-Festival-finanze-solide-e-pi%C3%B9-collaborazione-coi-privati--3775024.html", "riassunto": "Il festival ticinese chiude l'edizione 2025 in attivo e guarda al 2026 con un budget analogo. Per la prima volta il contributo dei privati supera quello pubblico, segno di un modello di finanziamento più diversificato. Tra gli ospiti annunciati il regista Darren Aronofsky e l'attrice Isabella Rossellini; l'edizione 2026 tornerà allo storico schermo di Piazza Grande progettato da Livio Vacchini, dopo la scelta impopolare di una struttura alternativa. Notizia di rilievo diretto per il Ticino.", "rilevanza": 92, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Patrick Bruel annulla il concerto a Pully e rinvia Friburgo dopo accuse di molestie", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/spettacoli/1929230/festival-concerto-pully-friburgo-bruel-molestie-accuse-patrick", "riassunto": "Il cantante francese non si esibirà in Svizzera questa estate: cancellato definitivamente il concerto al Pully Live Festival e rinviato quello al Bellarena Indoor Festival di Friburgo. La sua società di produzione parla della volontà di non turbare la serenità delle manifestazioni, citando pressioni sugli organizzatori. Sullo sfondo, indagini giudiziarie in Francia e Belgio per accuse di molestie e stupro. Le altre date del tour fuori dai festival restano confermate.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Magadino, 63 anni di musica: un libro racconta il Festival internazionale organistico", "fonte": "Ticinonews Magazine", "link": "https://www.ticinonews.ch/magazine/magadino-63-anni-di-musica-un-libro-racconta-il-festival-internazionale-organistico-432909", "riassunto": "Un volume di Giuseppe Clericetti, presentato l'11 maggio nella chiesa di San Carlo, celebra una delle rassegne organistiche più longeve d'Europa, nata nel 1963 sulle rive del Verbano. Il libro ripercorre la storia del festival e dell'organo, che oggi conta oltre 2300 canne e necessita di nuovi interventi. La RSI è citata come protagonista: le sue registrazioni hanno contribuito a diffondere il nome di Magadino oltre i confini nazionali. Notizia di interesse culturale ticinese.", "rilevanza": 80, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Cannes: seconda Palma d'oro per Cristian Mungiu con 'Fjord'", "fonte": "RSI Cultura", "link": "https://www.rsi.ch/info/cultura-e-spettacoli/Cannes-seconda-Palma-d%E2%80%99oro-per-Cristian-Mungiu--3764089.html", "riassunto": "Il regista rumeno Cristian Mungiu conquista la Palma d'oro della 79ma edizione del Festival di Cannes con 'Fjord', storia di una coppia rumeno-norvegese in un villaggio isolato. È il suo secondo trionfo dopo quello del 2007. L'edizione si è distinta per i premi all'interpretazione assegnati ex aequo a duetti maschili e femminili. Evento di rilievo internazionale, ben coperto con due articoli RSI.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Addio al sociologo e filosofo francese Edgar Morin", "fonte": "RSI Cultura", "link": "https://www.rsi.ch/info/cultura-e-spettacoli/Addio-al-sociologo-e-filosofo-francese-Edgar-Morin--3781483.html", "riassunto": "È morto a 104 anni Edgar Morin, figura di spicco della vita intellettuale francese, autore di un'opera vasta e conosciuta ben oltre i confini della Francia. Si definiva un 'bracconiere del sapere' e proponeva una riflessione sull'Uomo a partire dai dati della scienza, in controtendenza con la sociologia tradizionale. La notizia è stata data dall'AFP, che l'ha appresa dalla moglie.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 1, "vertot": 1}]}, {"key": "geopolitica", "emoji": "🌍", "nome": "Geopolitica & Esteri", "sommario": "Domina l'escalation in Medio Oriente: l'avanzata israeliana in Libano minaccia un attacco a Beirut, congelato all'ultimo dall'intervento USA, mentre l'Iran blocca i negoziati e i mercati asiatici ne risentono. Sul fronte europeo, accordo UE sul regolamento rimpatri con hub nei Paesi terzi; gli USA valutano armi nucleari in altri Stati NATO.", "raccolte": 571, "stories": [{"titolo": "Media, 'Israele stava per attaccare Beirut, fermato dagli Usa'", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/media-israele-stava-per-attaccare-beirut-fermato-dagli-usa_906dc61e-4d49-4a96-9b35-7bd5e8e57a20.html", "riassunto": "Secondo la tv pubblica israeliana Kan, Israele aveva pianificato un attacco su vasta scala contro la roccaforte di Hezbollah a Dahiyeh, alla periferia di Beirut, rinviato all'ultimo minuto per l'intervento americano. La notizia si incrocia con le dichiarazioni di Trump e Netanyahu della stessa giornata, che confermano i contatti diplomatici per evitare l'allargamento del conflitto. Il dato segnala quanto sia stato vicino il salto di scala militare in Libano, con il ruolo decisivo di Washington nel frenare l'operazione.", "rilevanza": 88, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Trump, ho parlato con Netanyahu, non ci saranno truppe a Beirut", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/trump-ho-parlato-con-netanyahu-non-ci-saranno-truppe-a-beirut_c8994d97-c1a6-449c-9784-c868f245bed7.html", "riassunto": "Trump annuncia su Truth una telefonata 'molto produttiva' con Netanyahu, escludendo l'invio di truppe verso Beirut, e riferisce di un contatto anche con Hezbollah, che avrebbe concordato il cessate il fuoco purché Israele non attacchi. Il presidente sostiene inoltre che i colloqui con l'Iran 'proseguono a ritmo serrato', in contrasto con altre fonti che danno i negoziati per bloccati. Le sue affermazioni vanno lette con cautela perché unilaterali e non confermate dalle controparti.", "rilevanza": 84, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Netanyahu, ho detto a Trump che colpiremo Beirut in caso di attacchi di Hezbollah", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/netanyahu-ho-detto-a-trump-che-colpiremo-beirut-in-caso-di-attacchi-di-hezbollah_46d87a90-7ce7-437f-83f0-8489be542e24.html", "riassunto": "Il premier israeliano Netanyahu, citato da Haaretz, riferisce di aver avvertito Trump che Israele colpirà obiettivi terroristici a Beirut se Hezbollah non smetterà di attaccare le città israeliane. Conferma inoltre che l'Idf continuerà a operare 'come previsto' nel Libano meridionale. La posizione, più dura del messaggio rassicurante di Trump, evidenzia la fragilità della tregua e la distanza tra le due narrazioni sullo stesso colloquio.", "rilevanza": 82, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Accordo in Ue sul regolamento rimpatri, sì agli hub in Paesi terzi", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/europa/2026/06/01/accordo-in-ue-sul-regolamento-rimpatri-si-agli-hub-in-paesi-terzi_45366dd2-9f4f-4325-9246-7053a7a3f3b9.html", "riassunto": "Parlamento europeo e Consiglio hanno trovato l'intesa in trilogo sul regolamento rimpatri, ultimo tassello del Patto Migrazione e Asilo. Le nuove norme impongono obblighi di cooperazione ai cittadini di Paesi terzi senza diritto di soggiorno e prevedono la creazione di hub per i rimpatri al di fuori dell'UE. L'accordo deve ancora passare il vaglio della commissione Libe e della plenaria. Dossier di interesse diretto per la Svizzera, parte dello spazio Schengen/Dublino e fortemente esposta alle politiche migratorie europee.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Ft, 'Usa stanno discutendo idea armi nucleari in altri Paesi Nato'", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/02/ft-usa-stanno-discutendo-idea-armi-nucleari-in-altri-paesi-nato_64d8077d-e4ca-494d-afd6-e4297b03f8d7.html", "riassunto": "Secondo il Financial Times, gli Stati Uniti starebbero valutando lo schieramento di armi nucleari in altri Stati membri della NATO in Europa, per rassicurare gli alleati dopo la riduzione del supporto militare convenzionale. I più interessati a ospitare basi DCA, con velivoli a duplice capacità, sarebbero Polonia e alcuni Stati baltici, sul fianco orientale dell'Alleanza. Una mossa che, se confermata, ridisegnerebbe gli equilibri di deterrenza in Europa, con riflessi sulla sicurezza dell'intero continente.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Trump, non mi importa se i negoziati con l'Iran sono finiti", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/01/trump-non-mi-importa-se-i-negoziati-con-liran-sono-finiti_7c114036-a6a7-4b93-bae2-0da9f15c77e9.html", "riassunto": "In un'intervista a Cnbc, Trump minimizza la possibile fine dei negoziati indiretti con l'Iran, bloccati da Teheran per protesta contro l'escalation israeliana in Libano: 'Non mi importa se sono finiti'. La frase contrasta con altre sue dichiarazioni dello stesso giorno secondo cui i colloqui 'proseguono a ritmo serrato', segnalando un messaggio diplomatico ambiguo. Lo stallo negoziale pesa sui mercati e alimenta l'incertezza sullo Stretto di Hormuz.", "rilevanza": 66, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crosetto, 'in Libano come in Ucraina pace parta da fine ostilità'", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/mediooriente/2026/06/01/crosetto-in-libano-come-in-ucraina-pace-parta-da-fine-ostilita_a81f6f1d-a1b1-4fbd-90b2-6182c6ff9326.html", "riassunto": "Il ministro della Difesa italiano Guido Crosetto, intervenendo a Cinque Minuti, avverte che l'avanzata israeliana in Libano allontana un serio piano di pace, che deve partire dalla cessazione delle ostilità come in Ucraina. Sottolinea che il contingente italiano nell'Unifil non è in grado di assolvere il suo compito con una guerra in corso. Il punto tocca la tenuta della missione di pace ONU nel sud del Libano, dove operano anche militari di vari Paesi europei.", "rilevanza": 60, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "economia", "emoji": "💰", "nome": "Economia & Finanza", "sommario": "Dominano i temi svizzeri: l'inchiesta del MPC sul colosso ginevrino Gunvor per sospetta corruzione, due misure fiscali approvate alle Camere (soglia IVA e app QuickZoll) e gli equilibri del turismo (campeggi, Crans-Montana). Sullo sfondo il dibattito globale sulle valutazioni dei giganti dell'IA.", "raccolte": 67, "stories": [{"titolo": "Perquisita a Ginevra la sede di Gunvor per sospetta corruzione", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/cronaca/1929776/stata-gunvor-corruzione-ginevra-perquisita-sede", "riassunto": "La sede ginevrina del gigante delle materie prime Gunvor è stata perquisita a maggio dall'Ufficio federale di polizia su mandato del Ministero pubblico della Confederazione, nell'ambito di un procedimento contro ignoti per sospetta corruzione di pubblici ufficiali stranieri. Al centro, secondo l'ONG Public Eye, un contratto petrolifero in Gabon del 2024 con presunti pagamenti paralleli a intermediari in Africa. Gunvor respinge le accuse, dicendosi estranea e collaborativa. La società è però già stata condannata in Svizzera nel 2019 (Congo, Costa d'Avorio) e nel 2024 (Ecuador) per casi di corruzione.", "rilevanza": 88, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Ridurre a 150 franchi la soglia per il rimborso IVA, c'è il \"sì\" del Nazionale", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1929818/svizzera-franchi-soglia-nazionale-rimborso-iva", "riassunto": "Il Consiglio nazionale ha approvato con 128 voti contro 65 una mozione di Leo Müller (Centro/LU) per abbassare da 300 a 150 franchi la soglia minima di spesa necessaria a ottenere il rimborso dell'IVA, così da rilanciare il turismo degli acquisti e la competitività rispetto ai Paesi vicini. Le minori entrate fiscali sono stimate in circa due milioni di franchi, compensate secondo i promotori da maggiori acquisti. Karin Keller-Sutter, a favore, parla di armonizzazione con la soglia applicata agli svizzeri che comprano all'estero. Critico David Roth (PS/LU): benefici limitati a pochi settori e marchi di lusso. Il dossier passa agli Stati.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Con l'app QuickZoll per sdoganare la spesa si potrà selezionare l'aliquota ridotta", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/attualita/1929817/aliquota-beni-app-spesa-franchi", "riassunto": "L'Ufficio federale della dogana e della sicurezza dei confini (UDSC) ha aggiornato l'app QuickZoll consentendo di pagare anche con l'aliquota ridotta del 2,6%, quella sui beni di largo consumo, finora non disponibile a fronte del solo 8,1%. L'app, utilizzabile senza registrazione, permette di autodichiarare la spesa entro una finestra di due ore al confine. Da gennaio 2025 la soglia di esenzione IVA per gli acquisti oltre frontiera è fissata a 150 franchi al giorno per persona. L'uso è in forte crescita: dalle 13'000 dichiarazioni del 2018 a oltre 192'000 nel 2025, con 13 milioni di franchi di entrate.", "rilevanza": 68, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Campeggi, Swisscamps avverte: rischio affollamento dopo le chiusure", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/attualita/1929773/chiusure-swisscamps-pericoli-campeggi-rischio", "riassunto": "L'associazione dei proprietari Swisscamps avverte che le chiusure di campeggi per pericoli naturali, pur giuste dove i rischi sono immediati, rischiano di produrre sovraffollamento e camping selvaggio. In Vallese a inizio marzo la commissione edilizia cantonale ha sospeso l'attività di 13 campeggi per frane, colate detritiche ed erosione; altri casi a Gampelen (BE) e Zugo. Con una domanda turistica in crescita, la capacità ricettiva è destinata a ridursi e sostituire i posti persi è giudicato \"solo in misura limitata realistico\" per ostacoli normativi, costi elevati e lunghe procedure edilizie.", "rilevanza": 58, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "ai_openclaw", "emoji": "🤖", "nome": "AI & Tech", "sommario": "Settimana dominata da falle di sicurezza e dalle grandi manovre dell'AI: il chatbot di Meta apre la porta al furto di account Instagram, la Florida fa causa a OpenAI, Anthropic prepara l'IPO e papa Leone XIV dedica all'AI la sua prima enciclica. Sullo sfondo, incidenti spaziali (Blue Origin, Starship) e la corsa fallita di Microsoft.", "raccolte": 57, "stories": [{"titolo": "\"Il buco di sicurezza più stupido\": hacker prendono il controllo di account Instagram con una sola frase", "fonte": "Blick Digital", "link": "https://www.blick.ch/digital/duemmste-sicherheitsluecke-hacker-kapern-reihenweise-instagram-konten-mit-einem-satz-id21995630.html", "riassunto": "Il chatbot di supporto AI di Meta collegava un nuovo indirizzo email a un account Instagram altrui su semplice richiesta, inviando a quella mail il codice di conferma e permettendo agli aggressori di resettare la password ed escludere il vero proprietario. Tra i profili violati quello del Casa Bianca dell'era Obama (poi usato per un messaggio pro-iraniano), il sottufficiale più alto della US Space Force e la catena Sephora. Per aggirare il controllo geografico bastava una VPN; nemmeno l'autenticazione a due fattori proteggeva. Il ricercatore Siddharth Sundharam l'ha definita la falla più stupida mai vista; Meta l'ha poi chiusa.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Un'enciclica sulle intelligenze artificiali", "fonte": "Il Post Tecnologia", "link": "https://www.ilpost.it/2026/05/25/enciclica-leone-xiv-intelligenza-artificiale/", "riassunto": "Papa Leone XIV ha pubblicato \"Magnifica humanitas\", la prima enciclica del suo papato, interamente dedicata all'intelligenza artificiale, ai suoi rischi e ai dilemmi etici. Il testo, di quasi 36mila parole nella versione italiana, è rivolto soprattutto a politici e dirigenti delle grandi aziende AI: alla presentazione in Vaticano era presente il cofondatore di Anthropic Christopher Olah. Il papa richiama la torre di Babele come metafora del rischio di \"disumanizzazione\" e dell'idolatria del profitto, invitando a governare la tecnologia perché non aumenti le disparità.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "La Florida fa causa a OpenAI per problemi di sicurezza del chatbot", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/01/technology/florida-sues-openai-chatgpt-safety.html", "riassunto": "Secondo la descrizione, la Florida sarebbe il primo Stato USA a fare causa a OpenAI sostenendo che la sua tecnologia rappresenti un rischio per i minori e che l'azienda non abbia avvertito il pubblico dei pericoli. Il corpo dell'articolo non è disponibile, quindi non è possibile verificare dettagli, capi d'accusa o richieste: notizia da confermare su font <script>
const DAYS=JSON.parse(document.getElementById('data').textContent);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function analisiHTML(day){
 let h='<div class="sec">📊 Analisi del giorno</div>';
 for(const c of day.analisi){
  if(!c.stories.length && !c.sommario) continue;
  h+=`<div class="cat">${c.emoji} ${esc(c.nome)} <small>(${c.stories.length} in evidenza · ${c.raccolte} raccolte)</small></div>`;
  if(c.sommario) h+=`<div class="somm">${esc(c.sommario)}</div>`;
  for(const s of c.stories){
   const rsi=s.rsi?`<span class="badge b-rsi">priorità RSI/SSR</span>`:'';
   const v=s.vertot>0?(s.verok===s.vertot?`<span class="b-ok">✓ ${s.verok}/${s.vertot} fatti verificati</span>`:`<span class="b-warn">⚠ ${s.verok}/${s.vertot} verificati</span>`):'';
   const aff=s.aff?'':`<span class="b-warn"> · fonte senza corpo, riassunto prudente</span>`;
   h+=`<div class="card"><span class="b-rel">ril. ${s.rilevanza}</span><a class="t" href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.titolo)}</a>${rsi}
   <div class="meta">${esc(s.fonte)}${aff}</div><div class="r">${esc(s.riassunto)}</div><div style="margin-top:6px">${v}</div></div>`;
  }
 }
 return h;
}
function raccoltaHTML(day,idx){
 let h=`<details class="coll"><summary>🗂️ Tutte le notizie raccolte (${day.totale})</summary><div style="padding:0 14px 12px">`;
 h+=`<input class="search" data-day="${idx}" placeholder="🔍 Cerca in questa giornata...">`;
 h+=`<div class="collbox" data-day="${idx}">`;
 for(const c of day.collezione){
  if(!c.items.length) continue;
  h+=`<div class="subcat" data-sub>${c.emoji} ${esc(c.nome)} <span style="color:var(--mut);font-weight:500">(${c.conteggio})</span></div>`;
  for(const it of c.items){
   h+=`<div class="li" data-txt="${esc((it.titolo+' '+it.fonte).toLowerCase())}"><a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.titolo)}</a> <span class="s">· ${esc(it.fonte)}</span></div>`;
  }
 }
 h+='</div></div></details>';
 return h;
}
const root=document.getElementById('days');
if(!DAYS.length){ root.innerHTML='<div class="empty">Nessun giorno in archivio.</div>'; }
DAYS.forEach((day,idx)=>{
 const d=document.createElement('details'); d.className='day'; if(idx===0) d.open=true;
 d.innerHTML=`<summary>📅 ${esc(day.date_label)} <span class="daymeta">· ${day.totale} notizie · ${day.n_analizzate} analizzate · ${day.verifica.ver}/${day.verifica.tot} fatti ✓</span><span class="chev">▾</span></summary>
 <div class="daybody">${analisiHTML(day)}${raccoltaHTML(day,idx)}</div>`;
 root.appendChild(d);
});
// ricerca per-giornata
document.querySelectorAll('.search').forEach(q=>{
 q.addEventListener('input',()=>{
  const s=q.value.trim().toLowerCase(); const box=document.querySelector(`.collbox[data-day="${q.dataset.day}"]`);
  box.querySelectorAll('.li').forEach(li=>li.classList.toggle('hide', s && !li.dataset.txt.includes(s)));
  box.querySelectorAll('[data-sub]').forEach(c=>{let n=c.nextElementSibling,vis=0;while(n&&n.classList.contains('li')){if(!n.classList.contains('hide'))vis++;n=n.nextElementSibling;}c.classList.toggle('hide',s&&vis===0);});
 });
});
</script></body></html>
