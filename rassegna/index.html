<script id="data" type="application/json">{"days": [{"date_iso": "2026-06-06", "date_label": "Sabato 6 giugno 2026", "verifica": {"ver": 33, "tot": 58}, "totale": 785, "n_analizzate": 30, "analisi": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "sommario": "Il Ticino al centro del braccio di ferro con Berna sulla tassa sanitaria italiana, mentre il Mendrisiotto vara una rete contro la violenza domestica. Cronaca nera dalla Svizzera con un femminicidio in Argovia e un incendio a Basilea; il sindaco di Crans-Montana rompe il silenzio sul rogo di Capodanno.", "raccolte": 82, "stories": [{"titolo": "Tassa sulla salute italiana: Ticino e Berna su posizioni diverse", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Tassa-sulla-salute-italiana-Ticino-e-Berna-su-posizioni-diverse--3795504.html", "riassunto": "La perizia commissionata dal Canton Ticino sulla tassa sulla salute italiana apre un confronto con la Confederazione. Berna, interpellata dalla RSI, ribadisce che una tassa a destinazione vincolata sarebbe conforme agli accordi attuali, sulla base di un parere esterno rivelatosi dell'ex professore di San Gallo Robert Waldburger: due professori, due pareri opposti. La Confederazione si dice aperta al dialogo e pronta a chiedere chiarimenti all'Italia. Il presidente della deputazione ticinese Bruno Storni (PS) avverte contro un blocco dei ristorni, giudicato uno strappo dannoso. Il vero braccio di ferro, oggi, è tra governo ticinese e Berna.", "rilevanza": 92, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Mendrisio presenta la sua rete contro la violenza domestica", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Mendrisio-presenta-la-sua-rete-contro-la-violenza-domestica--3795375.html", "riassunto": "Mendrisio, in collaborazione con Stabio e i comuni della regione di polizia II, ha presentato la propria rete di prevenzione della violenza domestica, estendendo al Mendrisiotto un'esperienza partita da Lugano nel 2023 e proseguita a Locarno. La psicologa del Centro competenza violenza della polizia cantonale Marina Lang spiega il parallelismo con la prevenzione sanitaria e lo slogan \"A casa tutto bene?\". L'obiettivo è intervenire sul cosiddetto sottosoglia: quattro casi su cinque non hanno implicazioni penali, ma il disagio c'è. I municipali Caverzasio e Maffi insistono sulla prossimità e sul non criminalizzare le famiglie.", "rilevanza": 84, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Femminicidio nel canton Argovia", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Femminicidio-nel-canton-Argovia--3795998.html", "riassunto": "Una donna di 36 anni è stata uccisa nel pomeriggio di mercoledì nel suo appartamento a Birr, nel canton Argovia. La polizia cantonale ha arrestato il marito 44enne, fortemente sospettato del delitto. L'allarme è giunto poco prima delle 14:00 ed è stato dato da uno dei bambini presenti in casa al momento dei fatti; i minori sono ora affidati alle cure della polizia. Gli agenti, intervenuti in forze, hanno trovato la donna con ferite da taglio, sanguinante e priva di sensi. Un nuovo caso di violenza letale in ambito domestico in Svizzera.", "rilevanza": 80, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crans-Montana: il sindaco rompe il silenzio dopo mesi", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Crans-Montana-il-sindaco-rompe-il-silenzio-dopo-mesi--3795758.html", "riassunto": "Dopo mesi di silenzio sul rogo del bar Constellation della notte di Capodanno, il sindaco di Crans-Montana Nicolas Féraud (PLR) ha accettato un'intervista con l'emittente vallesana Canal 9, la prima dopo quella del 27 gennaio. Féraud annuncia per il 16 giugno un'assemblea a Chermignon-d'en-Bas per fare il punto con trasparenza, ipotesi a porte chiuse che dice però di voler evitare. Pur fra numerose richieste di dimissioni, in particolare dai media italiani, ribadisce di non avere intenzione di lasciare. Un caso che resta sotto i riflettori della Svizzera romanda e italiana.", "rilevanza": 76, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Edificio in fiamme a Basilea", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Edificio-in-fiamme-a-Basilea--3796049.html", "riassunto": "Un grave incendio è divampato nella serata di mercoledì in un edificio del quartiere Dreispitz di Basilea, con un intervento in forze di pompieri e polizia. La Münchensteinerstrasse è stata chiusa al traffico, come indicato dalla polizia cantonale. Secondo le immagini riferite dal portale del Blick, dalle finestre uscivano fiamme alte diversi metri e un denso fumo ha avvolto l'area. Non è chiaro se nello stabile si trovassero persone. La polizia ha annunciato ulteriori informazioni in un secondo momento. Il bilancio resta da definire.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Economia svizzera: cresce con il freno a mano tirato", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/economia/Economia-svizzera-cresce-con-il-freno-a-mano-tirato--3794450.html", "riassunto": "Due rapporti, di Economiesuisse e dell'OCSE, fotografano un'economia svizzera che cresce sotto il proprio potenziale a causa delle incertezze geopolitiche. Economiesuisse prevede un PIL all'1,0% nel 2026 (pronostico confermato) e all'1,2% nel 2027, con inflazione allo 0,8% quest'anno e all'1,0% nei dodici mesi successivi. I conflitti in Ucraina e Medio Oriente, le quotazioni elevate del petrolio e i maggiori costi di trasporto spingono i prezzi. Per la federazione delle imprese un'impennata dell'inflazione come dopo l'invasione russa non è però attesa. L'OCSE rinvia una crescita concreta al 2027.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Bevande energetiche in vendita con troppa caffeina", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/dialogo/Bevande-energetiche-in-vendita-con-troppa-caffeina--3794230.html", "riassunto": "Un'inchiesta di Impact Investigativ (SRF) accende i riflettori sugli energy drink venduti con quantità eccessive di caffeina. Il racconto parte da Nicolas, 29enne che consuma circa tre lattine al giorno e si definisce dipendente, arrivato in un periodo a sei litri quotidiani. Le bevande, ricche di caffeina, zucchero e taurina, sono promosse soprattutto verso i giovani: secondo la Confederazione un giovane svizzero su cinque tra i 14 e i 17 anni ne consuma almeno uno a settimana. Tra i possibili effetti collaterali tachicardia, disturbi del sonno e nervosismo.", "rilevanza": 56, "rsi": true, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "cronaca_svizzera", "emoji": "🇨🇭", "nome": "Cronaca Svizzera", "sommario": "Dominano i temi economici svizzeri legati agli Stati Uniti: nuovi dazi USA al 12,5% sulla Svizzera e crollo della fiducia delle PMI. Forte presenza ticinese con la 'tassa sulla salute' sui frontalieri e gli sviluppi del caso Crans-Montana, oltre a un femminicidio in Argovia.", "raccolte": 94, "stories": [{"titolo": "Nuovi dazi USA fino al 12,5% per 60 Paesi, Svizzera inclusa", "fonte": "Ticinonews Svizzera / RSI Svizzera", "link": "https://www.ticinonews.ch/economia/proposti-nuovi-dazi-usa-fino-al-125-per-60-paesi-svizzera-compresa-434914", "riassunto": "Il rappresentante USA per il commercio Jamieson Greer ha proposto nuovi dazi dal 10% al 12,5% su 60 Paesi, accusati di non aver contrastato il lavoro forzato. Alla Svizzera spetterebbe l'aliquota massima del 12,5%, accanto a Cina, Vietnam, Taiwan e Regno Unito. La mossa rilancia la politica tariffaria dopo le battute d'arresto legali dell'amministrazione Trump e passerà da una consultazione pubblica. Il presidente della Confederazione Guy Parmelin ha respinto l'accusa a margine di una conferenza OCSE a Parigi, dopo un breve colloquio con lo stesso Greer. La SECO contesta la fondatezza delle contestazioni americane.", "rilevanza": 9 egato-negli-USA-dove-ESTA-%C3%A8-il-problema--3795138.html", "riassunto": "L'attaccante della Nazionale svizzera Breel Embolo non ha potuto imbarcarsi martedì con i compagni per gli Stati Uniti a causa di un problema con l'autorizzazione elettronica ESTA. Secondo l'Associazione svizzera di calcio, poco prima della partenza le autorità statunitensi hanno comunicato l'intenzione di riesaminare l'ESTA, fino ad allora valida. Si specula su un possibile legame con la condanna per minaccia passata in giudicato ad aprile, relativa a un'aggressione verbale del 2018 quando il 29enne giocava nel Basilea. L'ESTA consente l'ingresso senza visto fino a 90 giorni nell'ambito del Visa Waiver Program.", "rilevanza": 76, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crolla la fiducia delle PMI svizzere ai minimi storici", "fonte": "Ticinonews Svizzera", "link": "https://www.ticinonews.ch/svizzera/crolla-la-fiducia-delle-piccole-e-medie-imprese-svizzere-434916", "riassunto": "La fiducia delle piccole e medie imprese svizzere è scesa ai minimi da diversi anni: il barometro PMI NZZ è calato a -7,3 punti, il livello più basso dall'avvio delle indagini nel 2021. A pesare sono la situazione geopolitica, i dazi americani e la burocrazia. L'analisi della scuola universitaria Kalaidos, su 495 dirigenti, segnala criticità su scambi esteri, valuta, catene di approvvigionamento e oneri normativi. L'unico segnale positivo riguarda l'integrazione delle nuove tecnologie. Il 55% delle aziende si dice resiliente, una su dieci poco o per niente. L'indice esce in vista dello Swiss Economic Forum a Interlaken.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 1, "vertot": 2}, {"titolo": "Incendio di Crans-Montana: interrogato un ex municipale di Chermignon", "fonte": "RSI Svizzera", "link": "https://www.rsi.ch/info/svizzera/Incendio-a-Crans-Montana-interrogato-un-ex-municipale--3794856.html", "riassunto": "L'ex consigliere comunale Jérémie Rey ha accettato di rispondere agli inquirenti nell'inchiesta sull'incendio del bar 'Le Constellation' di Crans-Montana, a differenza di altri imputati che si sono avvalsi del silenzio. Rey, a capo del dicastero delle costruzioni dell'ex Comune di Chermignon dal 2013 al 2016, è al centro dell'audizione perché nel 2015 il Comune non richiese una domanda di costruzione né controlli approfonditi per gli importanti lavori di ristrutturazione del bar. Venerdì saranno interrogati anche i coniugi Moretti, che gestivano il locale.", "rilevanza": 68, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crans-Montana, il sindaco Féraud rompe il silenzio dopo 126 giorni", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/crans-montana-il-sindaco-torna-a-parlare-dopo-126-giorni-andare-via-sarebbe-una-diserzione-429632", "riassunto": "Il sindaco di Crans-Montana Nicolas Féraud (PLR) ha parlato a Canal 9 per la prima volta dopo 126 giorni di silenzio sulla tragedia di Capodanno. Ha difeso l'operato del Municipio e respinto le richieste di dimissioni, definendo un eventuale abbandono 'una diserzione'. Ha annunciato un'assemblea pubblica il 16 giugno a Chermignon-d'en-Bas per fare il punto con trasparenza, dicendosi contrario allo svolgimento a porte chiuse pur lasciando decidere la democrazia. Ha ribadito le scuse alle persone offese durante la conferenza stampa del 6 gennaio.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 0, "vertot": 2}]}, {"key": "cultura", "emoji": "🎭", "nome": "Cultura", "sommario": "Dominano gli appuntamenti musicali svizzeri: il Montreux Jazz Festival celebra i 60 anni omaggiando Miles Davis, mentre il ticinese Fabio Lafranchi riceve un premio internazionale. Spazio anche al lutto per il soulman Peabo Bryson (incrociato da due fonti) e a curiosità scientifiche da Ötzi ai polpi di Friborgo.", "raccolte": 68, "stories": [{"titolo": "Il Montreux Jazz Festival omaggia Miles Davis", "fonte": "CdT Società", "link": "https://www.cdt.ch/societa/il-montreux-jazz-festival-omaggia-miles-davis-429563", "riassunto": "Il Montreux Jazz Festival ha presentato il programma gratuito della 60esima edizione, in scena dal 3 al 18 luglio con oltre 700 fra concerti e attività su dodici palchi. La seconda settimana sarà dedicata al centenario della nascita di Miles Davis (1926-1991), con la proiezione di quattro suoi concerti a Montreux e la presentazione di dischi storici come «Kind of Blue». L'ultimo weekend celebrerà invece David Bowie e i suoi legami con il jazz. Un appuntamento di rilievo internazionale e di forte impatto per la Svizzera romanda.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Muore Peabo Bryson, voce R&B celebre per i duetti nei film Disney", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/musica/1930125/bryson-disney-anni-peabo-film-due-re-duetti", "riassunto": "È morto a 75 anni, pochi giorni dopo un ictus, il cantante R&B statunitense Peabo Bryson, vincitore di due Grammy. La sua voce è legata soprattutto ai duetti delle colonne sonore Disney: «Beauty and the Beast» con Céline Dion e «A Whole New World» da «Aladdin» con Regina Belle, brano con cui scalzò Whitney Houston dalla vetta delle classifiche USA. Nato in South Carolina, aveva costruito dagli anni Settanta una lunga carriera nell'R&B romantico americano. La notizia è confermata da più testate.", "rilevanza": 74, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Bluebird Award a Fabio Lafranchi", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/culture/1930210/blues-bluebird-award-lafranchi-fabio-blue", "riassunto": "Riconoscimento internazionale per il ticinese Fabio Lafranchi, cofondatore e direttore artistico del Vallemaggia Magic Blues, premiato con il Bluebird Award lo scorso fine settimana a Weinheim, in Germania. Il premio, attribuito dalla Beyond Blue Connection, ha celebrato nel tempo nomi come B.B. King ed Eddie Palmieri nella sezione artisti e importanti promotori culturali nella categoria Blue People. La motivazione elogia il contributo di Lafranchi nel rendere il festival vallemaggese un evento culturale di rilevanza internazionale.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Oh specchio, specchio delle mie brame...", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/scienze/1930115/specchio-polpi-grado-riflesse-immagini", "riassunto": "Uno studio dell'Università di Friborgo, condotto con il Dartmouth College e pubblicato su «Current Biology», dimostra che i polpi sanno usare consapevolmente le immagini riflesse da uno specchio per individuare cibo fuori dal loro campo visivo. È la prima volta che tale capacità viene provata in un invertebrato, finora osservata solo in vertebrati come scimmie, elefanti o uccelli. Nel 73% dei tentativi gli animali hanno scelto il percorso corretto, una percentuale che esclude statisticamente il caso. Una ricerca svizzera di valore scientifico.", "rilevanza": 66, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Ötzi, svelato il microbioma di 5.000 anni fa", "fonte": "Ticinonews Magazine", "link": "https://www.ticinonews.ch/magazine/otzi-svelato-il-microbioma-di-5000-anni-fa-434933", "riassunto": "Uno studio dell'Istituto per lo studio delle mummie di Eurac Research di Bolzano, pubblicato su «Microbiome», ha analizzato l'ecosistema di microrganismi della mummia del Similaun, distinguendo la flora intestinale originaria dell'Iceman dai microrganismi giunti dopo la morte. La scoperta più sorprendente riguarda lieviti specializzati simili a ceppi antartici, capaci di sopravvivere a temperature estreme e ancora vitali a -6°C nel Museo dell'Alto Adige. I risultati aprono prospettive per processi industriali a basse temperature.", "rilevanza": 58, "rsi": false, "aff": true, "verok": 0, "vertot": 2}]}, {"key": "geopolitica", "emoji": "🌍", "nome": "Geopolitica & Esteri", "sommario": "Dominano la diplomazia Trump-Iran (presunto stop al nucleare, possibile vertice con Khamenei) e l'avanzata israeliana nel sud del Libano, con tensioni anche tra Israele e il governo italiano. Sul fronte svizzero, novità doganali per i turisti dello shopping verso la Germania.", "raccolte": 458, "stories": [{"titolo": "Trump: l'Iran ha accettato di rinunciare alle armi nucleari", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/03/trump-liran-ha-accettato-di-rinunciare-alle-armi-nucleari_ac19fedf-dc00-4f54-a8a4-d4d0bcb00f21.html", "riassunto": "Donald Trump afferma che l'Iran avrebbe accettato di rinunciare alle armi nucleari, in un'intervista podcast con Miranda Devine del Washington Post. È una dichiarazione di forte peso geopolitico, ma resta unilaterale e non confermata da Teheran: va trattata con cautela in attesa di riscontri ufficiali. Il tema si lega ai negoziati in corso e alla possibilità, evocata dallo stesso Trump, di un futuro incontro con la guida suprema iraniana.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Trump: vogliamo separare la questione Libano dai negoziati con l'Iran", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/03/trump-vogliamo-separare-la-questione-libano-dai-negoziati-con-liran_c10349cd-0307-4c30-b7a4-f824320c9a18.html", "riassunto": "Trump vuole tenere distinti il dossier libanese e i negoziati con l'Iran, definendoli situazioni di natura diversa. Rivela contatti diretti con Hezbollah — a suo dire i primi in assoluto — e annuncia una tregua di fatto: il movimento sciita avrebbe acconsentito a non sparare, così come Israele. Una svolta potenzialmente rilevante per la de-escalation nel sud del Libano, da verificare sul terreno.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "L'invasione israeliana alimenta le divisioni tra i libanesi", "fonte": "Internazionale", "link": "https://www.internazionale.it/video/2026/06/04/israele-libano-divisioni", "riassunto": "L'esercito israeliano continua a occupare una fascia di territorio nel sud del Libano, dichiarando di voler sconfiggere Hezbollah, alleata di Teheran. Il documentario del Guardian con Matthew Cassel mostra come il conflitto stia accentuando le fratture tra le comunità libanesi: il disarmo di Hezbollah è condiviso da molti, ma i suoi sostenitori parlano di \"resistenza\" come unica difesa. In gioco la fragile convivenza costruita dopo la guerra civile (1975-1990).", "rilevanza": 65, "rsi": false, "aff": true, "verok": 0, "vertot": 2}]}, {"key": "economia", "emoji": "💰", "nome": "Economia & Finanza", "sommario": "Dominano i nuovi dazi USA del 12,5% minacciati alla Svizzera (e ad altre 60 economie) col pretesto del lavoro forzato, con la replica netta di SECO e Parmelin. In secondo piano l'acquisizione di Yfood da parte di Nestlé, le scelte formative dei giovani e il dibattito sulle quote rosa.", "raccolte": 40, "stories": [{"titolo": "Nuovi dazi? Gli USA accusano, la SECO respinge tutto", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930141/lavoro-svizzera-seco-dazi-stati-trump", "riassunto": "Washington minaccia dazi aggiuntivi del 12,5% a circa 60 economie, Svizzera inclusa, giustificandoli con la lotta al lavoro forzato e una legge commerciale del 1974. La SECO respinge le accuse: la direttrice Helene Budliger Artieda ha spiegato alla SRF che il lavoro forzato è già vietato dalla costituzione e dal diritto civile e penale, e che la Svizzera è stata pioniera nell'inserire il divieto negli appalti pubblici. La Segreteria nega distorsioni della concorrenza a danno delle imprese USA. È la storia economica più rilevante per impatto diretto sulla Confederazione e con citazione esplicita della SRF.", "rilevanza": 95, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Trump minaccia nuovamente la Svizzera", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930056/lavoro-svizzera-dazi-seco-trump-merci-minaccia", "riassunto": "L'Ufficio del Rappresentante per il Commercio USA ha annunciato martedì sera la minaccia di nuovi dazi contro 60 Paesi, tra cui UE, Gran Bretagna e Svizzera, accusati di non contrastare l'import di merci legate a presunto lavoro forzato. Le tariffe aggiuntive sarebbero comprese tra il 10 e il 12,5%. Il rappresentante Jamieson Greer parla di «concorrenza sleale» a danno dei lavoratori statunitensi. La decisione si fonda su un'indagine avviata il 12 marzo, con audizioni aperte fino a inizio luglio. Notizia breaking ad alto impatto commerciale.", "rilevanza": 90, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Svizzera sotto tiro USA, Parmelin: «Lavoriamo per trovare soluzioni»", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930137/lavoro-accuse-respinge-berna-dfe", "riassunto": "Il presidente e ministro dell'economia Guy Parmelin ha ribadito la posizione elvetica a Parigi, a margine della conferenza ministeriale dell'OCSE, in un incontro col rappresentante USA Jamieson Greer. Su X ha scritto che «entrambe le parti continuano a lavorare per trovare soluzioni». Il Dipartimento federale dell'economia respinge «veementemente» le accuse, rivendicando un approccio globale fatto di regolamentazione statale, valutazioni di rischio del settore privato e cooperazione internazionale. È il tassello diplomatico del dossier dazi.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Nestlé rileva la totalità di Yfood, leader nei pasti pronti da bere", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930105/yfood-nestle-pasti-leader-vendita", "riassunto": "Nestlé ha annunciato l'acquisizione totale della tedesca Yfood, leader europeo nei pasti pronti da bere, rilevando il 51% ancora in mano ai fondatori dopo essere entrata nel 2023 con il 49%. Il prezzo non è stato reso noto. Yfood, fondata nel 2017 a Monaco, mantiene autonomia operativa, sede in Germania e circa 150 dipendenti, con un fatturato 2025 di circa 150 milioni di euro (137 milioni di franchi) in crescita a doppia cifra. L'operazione rafforza il segmento nutrizione del gruppo guidato dal nuovo CEO Philipp Navratil.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "La maggior parte dei giovani ha già un contratto di apprendistato", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930128/scuola-giovani-apprendistato-svizzera-obbligo", "riassunto": "Secondo un'inchiesta di Keystone-ATS presso gli uffici competenti, la maggior parte dei giovani ha già scelto un posto di apprendistato per dopo la fine della scuola dell'obbligo, ma cresce il passaggio verso licei e scuole specializzate. Sul portale Yousty risultano 18'000 posti di tirocinio e quasi 15'000 nel registro Lena. Nel 2025 circa metà dei giovani ha iniziato una formazione professionale di base, mentre il 34% è entrato in liceo o scuola specializzata, quota in lieve crescita. Tema di mercato del lavoro rilevante per la Svizzera.", "rilevanza": 60, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "ai_openclaw", "emoji": "🤖", "nome": "AI & Tech", "sommario": "Settimana densa sul fronte AI europea: Anthropic apre a Milano e supera OpenAI per valutazione, mentre l'UE delinea un piano di sovranità tecnologica. Sul versante sicurezza, una falla nell'assistente AI di Meta esponeva i profili Instagram. Lutto nel giornalismo digitale italiano per la morte di Carola Frediani.", "raccolte": 43, "stories": [{"titolo": "L'Unione Europea delinea un piano per ridurre la dipendenza dalla tecnologia americana", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/03/technology/european-union-tech-sovereignty.html", "riassunto": "L'UE a 27 avrebbe presentato un piano per espandere data center, semiconduttori e capacità di cloud computing europei, nell'ottica di ridurre la dipendenza dalla tecnologia statunitense. Il tema della sovranità digitale è di diretto interesse per la Svizzera, integrata nei mercati e nelle infrastrutture europee. ATTENZIONE: il corpo dell'articolo non è disponibile, quindi i dettagli su strumenti, cifre e tempistiche restano da verificare alla fonte.", "rilevanza": 72, "rsi": false, "aff": false, "verok": 0, "vertot": 0}, {"titolo": "Anthropic è davvero più \"buona\" delle altre aziende di AI?", "fonte": "Il Post Tecnologia", "link": "https://www.ilpost.it/2026/06/03/anthropic-buona/", "riassunto": "Anthropic, fondata nel 2021 da ex ricercatori di OpenAI critici verso Sam Altman, coltiva da tempo l'immagine di azienda AI prudente; il pezzo di Pietro Minto mostra però che la realtà è più sfumata. Nell'ultimo anno la società è cresciuta fino a una valutazione di 965 miliardi di dollari, superando OpenAI. La scorsa settimana ha annunciato l'apertura della sesta sede europea, a Milano, e ricevuto nuovi investimenti per 65 miliardi. Il cofondatore Chris Olah era l'unico rappresentante del settore alla presentazione dell'enciclica di papa Leone XIV sull'AI. Rilievo per il lettore ticinese per la prossimità della nuova sede milanese.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Per hackerare i profili Instagram bastava chiedere all'assistente AI di Meta", "fonte": "Il Post Tecnologia", "link": "https://www.ilpost.it/2026/06/03/sicurezza-informatica-assistente-ai-meta-chatbot/", "riassunto": "Una falla nel chatbot di assistenza tecnica di Meta permetteva di prendere il controllo di profili Instagram e Facebook altrui. Bastava mascherare la posizione con una VPN impostandola su quella del titolare e, se richiesta, fornire una foto del profilo bersaglio modificata con l'AI per ingannare la verifica d'identità. A quel punto si poteva associare una nuova email all'account e farsi inviare un codice per cambiare la password. Tra i casi notevoli del weekend, un profilo Instagram legato a Barack Obama. Meta ha dichiarato di aver risolto il problema.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}], "collezione": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "conteggio": 82, "items": [{"titolo": "I Moretti “hanno risposto a tutte le domande”", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/I-Moretti-%E2%80%9Channo-risposto-a-tutte-le-domande%E2%80%9D--3801410.html"}, {"titolo": "Caccia a un orso “molto intelligente” in Giappone", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/mondo/Caccia-a-un-orso-%E2%80%9Cmolto-intelligente%E2%80%9D-in-Giappone--3799439.html"}, {"titolo": "Attesi 100’000 spettatori Coira punta a fare centro", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Attesi-100%E2%80%99000-spettatori-Coira-punta-a-fare-centro--3799643.html"}, {"titolo": "Allargare l’UE ai Balcani occidentali “è un imperativo”", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/mondo/Allargare-l%E2%80%99UE-ai-Balcani-occidentali-%E2%80%9C%C3%A8-un-imperativo%E2%80%9D--3801086.html"}, {"titolo": "Migros aprirà il suo primo supermercato 24 ore su 24 in Svizzera", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Migros-aprir%C3%A0-il-suo-primo-supermercato-24-ore-su-24-in-Svizzera--3801224.html"}, {"titolo": "Anthropic chiede una pausa nello sviluppo dell’intelligenza artificiale", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/scienza-e-tecnologia/Anthropic-chiede-una-pausa-nello-sviluppo-dell%E2%80%99intelligenza-artificiale--3799631.html"}, {"titolo": "Cambridge progettato con l’IA un “super vaccino” universale", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/scienza-e-tecnologia/Cambridge-progettato-con-l%E2%80%99IA-un-%E2%80%9Csuper-vaccino%E2%80%9D-universale--3800711.html"}, {"titolo": "Swisstopo da un secolo in volo per mappare la Svizzera", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Swisstopo-da-un-secol soft", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/05/technology/reid-hoffman-leaving-microsoft-board.html"}, {"titolo": "Pesa solo dodici grammi: la fascia da 99 franchi di Google può farcela", "fonte": "Blick Digital", "link": "https://www.blick.ch/digital/wiegt-nur-zwoelf-gramm-das-kann-googles-99-franken-band-id22005937.html"}]}]}, {"date_iso": "2026-06-05", "date_label": "Venerdì 5 giugno 2026", "verifica": {"ver": 33, "tot": 58}, "totale": 850, "n_analizzate": 30, "analisi": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "sommario": "Il Ticino al centro del braccio di ferro con Berna sulla tassa sanitaria italiana, mentre il Mendrisiotto vara una rete contro la violenza domestica. Cronaca nera dalla Svizzera con un femminicidio in Argovia e un incendio a Basilea; il sindaco di Crans-Montana rompe il silenzio sul rogo di Capodanno.", "raccolte": 74, "stories": [{"titolo": "Tassa sulla salute italiana: Ticino e Berna su posizioni diverse", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Tassa-sulla-salute-italiana-Ticino-e-Berna-su-posizioni-diverse--3795504.html", "riassunto": "La perizia commissionata dal Canton Ticino sulla tassa sulla salute italiana apre un confronto con la Confederazione. Berna, interpellata dalla RSI, ribadisce che una tassa a destinazione vincolata sarebbe conforme agli accordi attuali, sulla base di un parere esterno rivelatosi dell'ex professore di San Gallo Robert Waldburger: due professori, due pareri opposti. La Confederazione si dice aperta al dialogo e pronta a chiedere chiarimenti all'Italia. Il presidente della deputazione ticinese Bruno Storni (PS) avverte contro un blocco dei ristorni, giudicato uno strappo dannoso. Il vero braccio di ferro, oggi, è tra governo ticinese e Berna.", "rilevanza": 92, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Mendrisio presenta la sua rete contro la violenza domestica", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Mendrisio-presenta-la-sua-rete-contro-la-violenza-domestica--3795375.html", "riassunto": "Mendrisio, in collaborazione con Stabio e i comuni della regione di polizia II, ha presentato la propria rete di prevenzione della violenza domestica, estendendo al Mendrisiotto un'esperienza partita da Lugano nel 2023 e proseguita a Locarno. La psicologa del Centro competenza violenza della polizia cantonale Marina Lang spiega il parallelismo con la prevenzione sanitaria e lo slogan \"A casa tutto bene?\". L'obiettivo è intervenire sul cosiddetto sottosoglia: quattro casi su cinque non hanno implicazioni penali, ma il disagio c'è. I municipali Caverzasio e Maffi insistono sulla prossimità e sul non criminalizzare le famiglie.", "rilevanza": 84, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Femminicidio nel canton Argovia", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Femminicidio-nel-canton-Argovia--3795998.html", "riassunto": "Una donna di 36 anni è stata uccisa nel pomeriggio di mercoledì nel suo appartamento a Birr, nel canton Argovia. La polizia cantonale ha arrestato il marito 44enne, fortemente sospettato del delitto. L'allarme è giunto poco prima delle 14:00 ed è stato dato da uno dei bambini presenti in casa al momento dei fatti; i minori sono ora affidati alle cure della polizia. Gli agenti, intervenuti in forze, hanno trovato la donna con ferite da taglio, sanguinante e priva di sensi. Un nuovo caso di violenza letale in ambito domestico in Svizzera.", "rilevanza": 80, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crans-Montana: il sindaco rompe il silenzio dopo mesi", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Crans-Montana-il-sindaco-rompe-il-silenzio-dopo-mesi--3795758.html", "riassunto": "Dopo mesi di silenzio sul rogo del bar Constellation della notte di Capodanno, il sindaco di Crans-Montana Nicolas Féraud (PLR) ha accettato un'intervista con l'emittente vallesana Canal 9, la prima dopo quella del 27 gennaio. Féraud annuncia per il 16 giugno un'assemblea a Chermignon-d'en-Bas per fare il punto con trasparenza, ipotesi a porte chiuse che dice però di voler evitare. Pur fra numerose richieste di dimissioni, in particolare dai media italiani, ribadisce di non avere intenzione di lasciare. Un caso che resta sotto i riflettori della Svizzera romanda e italiana.", "rilevanza": 76, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Edificio in fiamme a Basilea", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Edificio-in-fiamme-a-Basilea--3796049.html", "riassunto": "Un grave incendio è divampato nella serata di mercoledì in un edificio del quartiere Dreispitz di Basilea, con un intervento in forze di pompieri e polizia. La Münchensteinerstrasse è stata chiusa al traffico, come indicato dalla polizia cantonale. Secondo le immagini riferite dal portale del Blick, dalle finestre uscivano fiamme alte diversi metri e un denso fumo ha avvolto l'area. Non è chiaro se nello stabile si trovassero persone. La polizia ha annunciato ulteriori informazioni in un secondo momento. Il bilancio resta da definire.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Economia svizzera: cresce con il freno a mano tirato", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/economia/Economia-svizzera-cresce-con-il-freno-a-mano-tirato--3794450.html", "riassunto": "Due rapporti, di Economiesuisse e dell'OCSE, fotografano un'economia svizzera che cresce sotto il proprio potenziale a causa delle incertezze geopolitiche. Economiesuisse prevede un PIL all'1,0% nel 2026 (pronostico confermato) e all'1,2% nel 2027, con inflazione allo 0,8% quest'anno e all'1,0% nei dodici mesi successivi. I conflitti in Ucraina e Medio Oriente, le quotazioni elevate del petrolio e i maggiori costi di trasporto spingono i prezzi. Per la federazione delle imprese un'impennata dell'inflazione come dopo l'invasione russa non è però attesa. L'OCSE rinvia una crescita concreta al 2027.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Bevande energetiche in vendita con troppa caffeina", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/dialogo/Bevande-energetiche-in-vendita-con-troppa-caffeina--3794230.html", "riassunto": "Un'inchiesta di Impact Investigativ (SRF) accende i riflettori sugli energy drink venduti con quantità eccessive di caffeina. Il racconto parte da Nicolas, 29enne che consuma circa tre lattine al giorno e si definisce dipendente, arrivato in un periodo a sei litri quotidiani. Le bevande, ricche di caffeina, zucchero e taurina, sono promosse soprattutto verso i giovani: secondo la Confederazione un giovane svizzero su cinque tra i 14 e i 17 anni ne consuma almeno uno a settimana. Tra i possibili effetti collaterali tachicardia, disturbi del sonno e nervosismo.", "rilevanza": 56, "rsi": true, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "cronaca_svizzera", "emoji": "🇨🇭", "nome": "Cronaca Svizzera", "sommario": "Dominano i temi economici svizzeri legati agli Stati Uniti: nuovi dazi USA al 12,5% sulla Svizzera e crollo della fiducia delle PMI. Forte presenza ticinese con la 'tassa sulla salute' sui frontalieri e gli sviluppi del caso Crans-Montana, oltre a un femminicidio in Argovia.", "raccolte": 107, "stories": [{"titolo": "Nuovi dazi USA fino al 12,5% per 60 Paesi, Svizzera inclusa", "fonte": "Ticinonews Svizzera / RSI Svizzera", "link": "https://www.ticinonews.ch/economia/proposti-nuovi-dazi-usa-fino-al-125-per-60-paesi-svizzera-compresa-434914", "riassunto": "Il rappresentante USA per il commercio Jamieson Greer ha proposto nuovi dazi dal 10% al 12,5% su 60 Paesi, accusati di non aver contrastato il lavoro forzato. Alla Svizzera spetterebbe l'aliquota massima del 12,5%, accanto a Cina, Vietnam, Taiwan e Regno Unito. La mossa rilancia la politica tariffaria dopo le battute d'arresto legali dell'amministrazione Trump e passerà da una consultazione pubblica. Il presidente della Confederazione Guy Parmelin ha respinto l'accusa a margine di una conferenza OCSE a Parigi, dopo un breve colloquio con lo stesso Greer. La SECO contesta la fondatezza delle contestazioni americane.", "rilevanza": 92, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Uccide la compagna a Birr (AG), arrestato il presunto autore", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/svizzera/uccide-la-compagna-in-un-complesso-residenziale-arrestato-il-presunto-autore-429609", "riassunto": "Una donna è stata uccisa a Birr, nel Canton Argovia, in un caso riconducibile alla violenza domestica. Secondo l'Aargauer Zeitung, il presunto responsabile, identificato nel compagno della vittima, è stato arrestato poco dopo i fatti. La polizia cantonale argoviese è intervenuta con un importante dispositivo in una zona residenziale, transennando l'area per i rilievi della scientifica. Sono in corso accertamenti per chiarire l'esatta dinamica dell'aggressione, avvenuta all'interno del complesso abitativo.", "rilevanza": 84, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "'Tassa sulla salute' italiana: Quadri incalza il Consiglio federale", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/tassa-sulla-salute-quadri-incalza-il-consiglio-federale-dopo-la-perizia-hinny-429612", "riassunto": "Il consigliere nazionale leghista Lorenzo Quadri porta a Berna la perizia commissionata dal Cantone Ticino sulla 'tassa sulla salute' italiana. Il professor Pascal Hinny, ordinario di diritto tributario a Friburgo, giudica il nuovo prelievo italiano sui vecchi frontalieri incompatibile con l'Accordo fiscale tra Svizzera e Italia. Quadri sottolinea che ciò contraddice la risposta del Consiglio federale del 20 maggio. Pur ritenendo la tassa positiva come funzione anti-dumping per il mercato del lavoro ticinese, chiede che Berna ne faccia valere l'incompatibilità per ridurre i ristorni fiscali versati oltre confine, trattenendo così più gettito.", "rilevanza": 80, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Embolo bloccato per il viaggio negli USA: il caso ESTA", "fonte": "RSI Svizzera", "link": "https://www.rsi.ch/info/svizzera/Embolo-il-viaggio-negato-negli-USA-dove-ESTA-%C3%A8-il-problema--3795138.html", "riassunto": "L'attaccante della Nazionale svizzera Breel Embolo non ha potuto imbarcarsi martedì con i compagni per gli Stati Uniti a causa di un problema con l'autorizzazione elettronica ESTA. Secondo l'Associazione svizzera di calcio, poco prima della partenza le autorità statunitensi hanno comunicato l'intenzione di riesaminare l'ESTA, fino ad allora valida. Si specula su un possibile legame con la condanna per minaccia passata in giudicato ad aprile, relativa a un'aggressione verbale del 2018 quando il 29enne giocava nel Basilea. L'ESTA consente l'ingresso senza visto fino a 90 giorni nell'ambito del Visa Waiver Program.", "rilevanza": 76, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crolla la fiducia delle PMI svizzere ai minimi storici", "fonte": "Ticinonews Svizzera", "link": "https://www.ticinonews.ch/svizzera/crolla-la-fiducia-delle-piccole-e-medie-imprese-svizzere-434916", "riassunto": "La fiducia delle piccole e medie imprese svizzere è scesa ai minimi da diversi anni: il barometro PMI NZZ è calato a -7,3 punti, il livello più basso dall'avvio delle indagini nel 2021. A pesare sono la situazione geopolitica, i dazi americani e la burocrazia. L'analisi della scuola universitaria Kalaidos, su 495 dirigenti, segnala criticità su scambi esteri, valuta, catene di approvvigionamento e oneri normativi. L'unico segnale positivo riguarda l'integrazione delle nuove tecnologie. Il 55% delle aziende si dice resiliente, una su dieci poco o per niente. L'indice esce in vista dello Swiss Economic Forum a Interlaken.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 1, "vertot": 2}, {"titolo": "Incendio di Crans-Montana: interrogato un ex municipale di Chermignon", "fonte": "RSI Svizzera", "link": "https://www.rsi.ch/info/svizzera/Incendio-a-Crans-Montana-interrogato-un-ex-municipale--3794856.html", "riassunto": "L'ex consigliere comunale Jérémie Rey ha accettato di rispondere agli inquirenti nell'inchiesta sull'incendio del bar 'Le Constellation' di Crans-Montana, a differenza di altri imputati che si sono avvalsi del silenzio. Rey, a capo del dicastero delle costruzioni dell'ex Comune di Chermignon dal 2013 al 2016, è al centro dell'audizione perché nel 2015 il Comune non richiese una domanda di costruzione né controlli approfonditi per gli importanti lavori di ristrutturazione del bar. Venerdì saranno interrogati anche i coniugi Moretti, che gestivano il locale.", "rilevanza": 68, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Crans-Montana, il sindaco Féraud rompe il silenzio dopo 126 giorni", "fonte": "CdT Svizzera", "link": "https://www.cdt.ch/news/crans-montana-il-sindaco-torna-a-parlare-dopo-126-giorni-andare-via-sarebbe-una-diserzione-429632", "riassunto": "Il sindaco di Crans-Montana Nicolas Féraud (PLR) ha parlato a Canal 9 per la prima volta dopo 126 giorni di silenzio sulla tragedia di Capodanno. Ha difeso l'operato del Municipio e respinto le richieste di dimissioni, definendo un eventuale abbandono 'una diserzione'. Ha annunciato un'assemblea pubblica il 16 giugno a Chermignon-d'en-Bas per fare il punto con trasparenza, dicendosi contrario allo svolgimento a porte chiuse pur lasciando decidere la democrazia. Ha ribadito le scuse alle persone offese durante la conferenza stampa del 6 gennaio.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 0, "vertot": 2}]}, {"key": "cultura", "emoji": "🎭", "nome": "Cultura", "sommario": "Dominano gli appuntamenti musicali svizzeri: il Montreux Jazz Festival celebra i 60 anni omaggiando Miles Davis, mentre il ticinese Fabio Lafranchi riceve un premio internazionale. Spazio anche al lutto per il soulman Peabo Bryson (incrociato da due fonti) e a curiosità scientifiche da Ötzi ai polpi di Friborgo.", "raccolte": 54, "stories": [{"titolo": "Il Montreux Jazz Festival omaggia Miles Davis", "fonte": "CdT Società", "link": "https://www.cdt.ch/societa/il-montreux-jazz-festival-omaggia-miles-davis-429563", "riassunto": "Il Montreux Jazz Festival ha presentato il programma gratuito della 60esima edizione, in scena dal 3 al 18 luglio con oltre 700 fra concerti e attività su dodici palchi. La seconda settimana sarà dedicata al centenario della nascita di Miles Davis (1926-1991), con la proiezione di quattro suoi concerti a Montreux e la presentazione di dischi storici come «Kind of Blue». L'ultimo weekend celebrerà invece David Bowie e i suoi legami con il jazz. Un appuntamento di rilievo internazionale e di forte impatto per la Svizzera romanda.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Muore Peabo Bryson, voce R&B celebre per i duetti nei film Disney", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/musica/1930125/bryson-disney-anni-peabo-film-due-re-duetti", "riassunto": "È morto a 75 anni, pochi giorni dopo un ictus, il cantante R&B statunitense Peabo Bryson, vincitore di due Grammy. La sua voce è legata soprattutto ai duetti delle colonne sonore Disney: «Beauty and the Beast» con Céline Dion e «A Whole New World» da «Aladdin» con Regina Belle, brano con cui scalzò Whitney Houston dalla vetta delle classifiche USA. Nato in South Carolina, aveva costruito dagli anni Settanta una lunga carriera nell'R&B romantico americano. La notizia è confermata da più testate.", "rilevanza": 74, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Bluebird Award a Fabio Lafranchi", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/culture/1930210/blues-bluebird-award-lafranchi-fabio-blue", "riassunto": "Riconoscimento internazionale per il ticinese Fabio Lafranchi, cofondatore e direttore artistico del Vallemaggia Magic Blues, premiato con il Bluebird Award lo scorso fine settimana a Weinheim, in Germania. Il premio, attribuito dalla Beyond Blue Connection, ha celebrato nel tempo nomi come B.B. King ed Eddie Palmieri nella sezione artisti e importanti promotori culturali nella categoria Blue People. La motivazione elogia il contributo di Lafranchi nel rendere il festival vallemaggese un evento culturale di rilevanza internazionale.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Oh specchio, specchio delle mie brame...", "fonte": "LaRegione Culture", "link": "https://www.laregione.ch/culture/scienze/1930115/specchio-polpi-grado-riflesse-immagini", "riassunto": "Uno studio dell'Università di Friborgo, condotto con il Dartmouth College e pubblicato su «Current Biology», dimostra che i polpi sanno usare consapevolmente le immagini riflesse da uno specchio per individuare cibo fuori dal loro campo visivo. È la prima volta che tale capacità viene provata in un invertebrato, finora osservata solo in vertebrati come scimmie, elefanti o uccelli. Nel 73% dei tentativi gli animali hanno scelto il percorso corretto, una percentuale che esclude statisticamente il caso. Una ricerca svizzera di valore scientifico.", "rilevanza": 66, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Ötzi, svelato il microbioma di 5.000 anni fa", "fonte": "Ticinonews Magazine", "link": "https://www.ticinonews.ch/magazine/otzi-svelato-il-microbioma-di-5000-anni-fa-434933", "riassunto": "Uno studio dell'Istituto per lo studio delle mummie di Eurac Research di Bolzano, pubblicato su «Microbiome», ha analizzato l'ecosistema di microrganismi della mummia del Similaun, distinguendo la flora intestinale originaria dell'Iceman dai microrganismi giunti dopo la morte. La scoperta più sorprendente riguarda lieviti specializzati simili a ceppi antartici, capaci di sopravvivere a temperature estreme e ancora vitali a -6°C nel Museo dell'Alto Adige. I risultati aprono prospettive per processi industriali a basse temperature.", "rilevanza": 58, "rsi": false, "aff": true, "verok": 0, "vertot": 2}]}, {"key": "geopolitica", "emoji": "🌍", "nome": "Geopolitica & Esteri", "sommario": "Dominano la diplomazia Trump-Iran (presunto stop al nucleare, possibile vertice con Khamenei) e l'avanzata israeliana nel sud del Libano, con tensioni anche tra Israele e il governo italiano. Sul fronte svizzero, novità doganali per i turisti dello shopping verso la Germania.", "raccolte": 519, "stories": [{"titolo": "Trump: l'Iran ha accettato di rinunciare alle armi nucleari", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/03/trump-liran-ha-accettato-di-rinunciare-alle-armi-nucleari_ac19fedf-dc00-4f54-a8a4-d4d0bcb00f21.html", "riassunto": "Donald Trump afferma che l'Iran avrebbe accettato di rinunciare alle armi nucleari, in un'intervista podcast con Miranda Devine del Washington Post. È una dichiarazione di forte peso geopolitico, ma resta unilaterale e non confermata da Teheran: va trattata con cautela in attesa di riscontri ufficiali. Il tema si lega ai negoziati in corso e alla possibilità, evocata dallo stesso Trump, di un futuro incontro con la guida suprema iraniana.", "rilevanza": 78, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "Trump: vogliamo separare la questione Libano dai negoziati con l'Iran", "fonte": "ANSA Mondo", "link": "https://www.ansa.it/sito/notizie/mondo/nordamerica/2026/06/03/trump-vogliamo-separare-la-questione-libano-dai-negoziati-con-liran_c10349cd-0307-4c30-b7a4-f824320c9a18.html", "riassunto": "Trump vuole tenere distinti il dossier libanese e i negoziati con l'Iran, definendoli situazioni di natura diversa. Rivela contatti diretti con Hezbollah — a suo dire i primi in assoluto — e annuncia una tregua di fatto: il movimento sciita avrebbe acconsentito a non sparare, così come Israele. Una svolta potenzialmente rilevante per la de-escalation nel sud del Libano, da verificare sul terreno.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 0, "vertot": 2}, {"titolo": "L'invasione israeliana alimenta le divisioni tra i libanesi", "fonte": "Internazionale", "link": "https://www.internazionale.it/video/2026/06/04/israele-libano-divisioni", "riassunto": "L'esercito israeliano continua a occupare una fascia di territorio nel sud del Libano, dichiarando di voler sconfiggere Hezbollah, alleata di Teheran. Il documentario del Guardian con Matthew Cassel mostra come il conflitto stia accentuando le fratture tra le comunità libanesi: il disarmo di Hezbollah è condiviso da molti, ma i suoi sostenitori parlano di \"resistenza\" come unica difesa. In gioco la fragile convivenza costruita dopo la guerra civile (1975-1990).", "rilevanza": 65, "rsi": false, "aff": true, "verok": 0, "vertot": 2}]}, {"key": "economia", "emoji": "💰", "nome": "Economia & Finanza", "sommario": "Dominano i nuovi dazi USA del 12,5% minacciati alla Svizzera (e ad altre 60 economie) col pretesto del lavoro forzato, con la replica netta di SECO e Parmelin. In secondo piano l'acquisizione di Yfood da parte di Nestlé, le scelte formative dei giovani e il dibattito sulle quote rosa.", "raccolte": 50, "stories": [{"titolo": "Nuovi dazi? Gli USA accusano, la SECO respinge tutto", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930141/lavoro-svizzera-seco-dazi-stati-trump", "riassunto": "Washington minaccia dazi aggiuntivi del 12,5% a circa 60 economie, Svizzera inclusa, giustificandoli con la lotta al lavoro forzato e una legge commerciale del 1974. La SECO respinge le accuse: la direttrice Helene Budliger Artieda ha spiegato alla SRF che il lavoro forzato è già vietato dalla costituzione e dal diritto civile e penale, e che la Svizzera è stata pioniera nell'inserire il divieto negli appalti pubblici. La Segreteria nega distorsioni della concorrenza a danno delle imprese USA. È la storia economica più rilevante per impatto diretto sulla Confederazione e con citazione esplicita della SRF.", "rilevanza": 95, "rsi": true, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Trump minaccia nuovamente la Svizzera", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930056/lavoro-svizzera-dazi-seco-trump-merci-minaccia", "riassunto": "L'Ufficio del Rappresentante per il Commercio USA ha annunciato martedì sera la minaccia di nuovi dazi contro 60 Paesi, tra cui UE, Gran Bretagna e Svizzera, accusati di non contrastare l'import di merci legate a presunto lavoro forzato. Le tariffe aggiuntive sarebbero comprese tra il 10 e il 12,5%. Il rappresentante Jamieson Greer parla di «concorrenza sleale» a danno dei lavoratori statunitensi. La decisione si fonda su un'indagine avviata il 12 marzo, con audizioni aperte fino a inizio luglio. Notizia breaking ad alto impatto commerciale.", "rilevanza": 90, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Svizzera sotto tiro USA, Parmelin: «Lavoriamo per trovare soluzioni»", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930137/lavoro-accuse-respinge-berna-dfe", "riassunto": "Il presidente e ministro dell'economia Guy Parmelin ha ribadito la posizione elvetica a Parigi, a margine della conferenza ministeriale dell'OCSE, in un incontro col rappresentante USA Jamieson Greer. Su X ha scritto che «entrambe le parti continuano a lavorare per trovare soluzioni». Il Dipartimento federale dell'economia respinge «veementemente» le accuse, rivendicando un approccio globale fatto di regolamentazione statale, valutazioni di rischio del settore privato e cooperazione internazionale. È il tassello diplomatico del dossier dazi.", "rilevanza": 85, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Nestlé rileva la totalità di Yfood, leader nei pasti pronti da bere", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930105/yfood-nestle-pasti-leader-vendita", "riassunto": "Nestlé ha annunciato l'acquisizione totale della tedesca Yfood, leader europeo nei pasti pronti da bere, rilevando il 51% ancora in mano ai fondatori dopo essere entrata nel 2023 con il 49%. Il prezzo non è stato reso noto. Yfood, fondata nel 2017 a Monaco, mantiene autonomia operativa, sede in Germania e circa 150 dipendenti, con un fatturato 2025 di circa 150 milioni di euro (137 milioni di franchi) in crescita a doppia cifra. L'operazione rafforza il segmento nutrizione del gruppo guidato dal nuovo CEO Philipp Navratil.", "rilevanza": 72, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "La maggior parte dei giovani ha già un contratto di apprendistato", "fonte": "tio.ch Svizzera", "link": "https://www.tio.ch/svizzera/economia/1930128/scuola-giovani-apprendistato-svizzera-obbligo", "riassunto": "Secondo un'inchiesta di Keystone-ATS presso gli uffici competenti, la maggior parte dei giovani ha già scelto un posto di apprendistato per dopo la fine della scuola dell'obbligo, ma cresce il passaggio verso licei e scuole specializzate. Sul portale Yousty risultano 18'000 posti di tirocinio e quasi 15'000 nel registro Lena. Nel 2025 circa metà dei giovani ha iniziato una formazione professionale di base, mentre il 34% è entrato in liceo o scuola specializzata, quota in lieve crescita. Tema di mercato del lavoro rilevante per la Svizzera.", "rilevanza": 60, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}, {"key": "ai_openclaw", "emoji": "🤖", "nome": "AI & Tech", "sommario": "Settimana densa sul fronte AI europea: Anthropic apre a Milano e supera OpenAI per valutazione, mentre l'UE delinea un piano di sovranità tecnologica. Sul versante sicurezza, una falla nell'assistente AI di Meta esponeva i profili Instagram. Lutto nel giornalismo digitale italiano per la morte di Carola Frediani.", "raccolte": 46, "stories": [{"titolo": "L'Unione Europea delinea un piano per ridurre la dipendenza dalla tecnologia americana", "fonte": "New York Times Technology", "link": "https://www.nytimes.com/2026/06/03/technology/european-union-tech-sovereignty.html", "riassunto": "L'UE a 27 avrebbe presentato un piano per espandere data center, semiconduttori e capacità di cloud computing europei, nell'ottica di ridurre la dipendenza dalla tecnologia statunitense. Il tema della sovranità digitale è di diretto interesse per la Svizzera, integrata nei mercati e nelle infrastrutture europee. ATTENZIONE: il corpo dell'articolo non è disponibile, quindi i dettagli su strumenti, cifre e tempistiche restano da verificare alla fonte.", "rilevanza": 72, "rsi": false, "aff": false, "verok": 0, "vertot": 0}, {"titolo": "Anthropic è davvero più \"buona\" delle altre aziende di AI?", "fonte": "Il Post Tecnologia", "link": "https://www.ilpost.it/2026/06/03/anthropic-buona/", "riassunto": "Anthropic, fondata nel 2021 da ex ricercatori di OpenAI critici verso Sam Altman, coltiva da tempo l'immagine di azienda AI prudente; il pezzo di Pietro Minto mostra però che la realtà è più sfumata. Nell'ultimo anno la società è cresciuta fino a una valutazione di 965 miliardi di dollari, superando OpenAI. La scorsa settimana ha annunciato l'apertura della sesta sede europea, a Milano, e ricevuto nuovi investimenti per 65 miliardi. Il cofondatore Chris Olah era l'unico rappresentante del settore alla presentazione dell'enciclica di papa Leone XIV sull'AI. Rilievo per il lettore ticinese per la prossimità della nuova sede milanese.", "rilevanza": 70, "rsi": false, "aff": true, "verok": 2, "vertot": 2}, {"titolo": "Per hackerare i profili Instagram bastava chiedere all'assistente AI di Meta", "fonte": "Il Post Tecnologia", "link": "https://www.ilpost.it/2026/06/03/sicurezza-informatica-assistente-ai-meta-chatbot/", "riassunto": "Una falla nel chatbot di assistenza tecnica di Meta permetteva di prendere il controllo di profili Instagram e Facebook altrui. Bastava mascherare la posizione con una VPN impostandola su quella del titolare e, se richiesta, fornire una foto del profilo bersaglio modificata con l'AI per ingannare la verifica d'identità. A quel punto si poteva associare una nuova email all'account e farsi inviare un codice per cambiare la password. Tra i casi notevoli del weekend, un profilo Instagram legato a Barack Obama. Meta ha dichiarato di aver risolto il problema.", "rilevanza": 64, "rsi": false, "aff": true, "verok": 2, "vertot": 2}]}], "collezione": [{"key": "cronaca_ticino", "emoji": "📌", "nome": "Cronaca Ticino", "conteggio": 74, "items": [{"titolo": "Dalla guerra alla pace un murale colora la scuola di Cresciano", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Dalla-guerra-alla-pace-un-murale-colora-la-scuola-di-Cresciano--3797825.html"}, {"titolo": "Ticino e ferrovie pressing su lavoro e investimenti", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Ticino-e-ferrovie-pressing-su-lavoro-e-investimenti--3798032.html"}, {"titolo": "Fronte rosso verde verso le cantonali unità nelle diversità", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Fronte-rosso-verde-verso-le-cantonali-unit%C3%A0-nelle-diversit%C3%A0--3798194.html"}, {"titolo": "Delle app fanno pagare la sosta nei posteggi privati", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/dialogo/Delle-app-fanno-pagare-la-sosta-nei-posteggi-privati--3792353.html"}, {"titolo": "Grigioni Lombardia resta la tensione sui costi delle Olimpiadi", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Grigioni-Lombardia-resta-la-tensione-sui-costi-delle-Olimpiadi--3797744.html"}, {"titolo": "Disoccupazione stabile al 3 in Svizzera", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/svizzera/Disoccupazione-stabile-al-3-in-Svizzera--3796679.html"}, {"titolo": "Un maxi modellino ferroviario a Bergün", "fonte": "RSI Ticino", "link": "https://www.rsi.ch/info/ticino-grigioni-e-in
